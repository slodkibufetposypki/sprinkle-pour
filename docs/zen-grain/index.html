<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zen Grain">
<meta name="description" content="Sort a spilled mess of lentils, rice and mung beans with chopsticks, one straight row at a time.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23262b31'/%3E%3Cpath d='M12 30 L15 4 M20 30 L17 4' stroke='%23d9ae72' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='9' r='2.6' fill='%23ef8a40'/%3E%3Ccircle cx='16' cy='14.5' r='2.6' fill='%23ef8a40'/%3E%3Ccircle cx='16' cy='20' r='2.6' fill='%23ef8a40'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23262b31'/%3E%3Cpath d='M12 30 L15 4 M20 30 L17 4' stroke='%23d9ae72' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='9' r='2.6' fill='%23ef8a40'/%3E%3Ccircle cx='16' cy='14.5' r='2.6' fill='%23ef8a40'/%3E%3Ccircle cx='16' cy='20' r='2.6' fill='%23ef8a40'/%3E%3C/svg%3E">
<title>Zen Grain</title>
<meta name="theme-color" content="#0f1215">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Cabin+Sketch:wght@700&family=Patrick+Hand&family=Zen+Antique+Soft&display=swap">
<style>
  /* Chalk on slate. Whatever is written on the board (score, multiplier, tallies, notes) is chalk in a hand;
     the menus are a slate slab across the bottom, inside thumb reach, with a chalk rule along its top edge.
     Small print stays in a plain face. The one loud thing is on the board itself: the chopstick tips heat up
     with the multiplier and a wrong grain quenches them. */
  :root {
    --slate: #0f1215;
    --slab: #171b20;
    --chalk: #ece8de;
    --chalk-2: rgba(236, 232, 222, 0.62);
    --chalk-3: rgba(236, 232, 222, 0.3);
    --lentil: #ef8a40;
    --mung: #8fb85a;
    --ember: #f6c453;
    --chalk-red: #ff7a6b;
    --hand: "Patrick Hand", "Segoe Print", "Bradley Hand", cursive;
    --sketch: "Cabin Sketch", "Patrick Hand", cursive;
    --print: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --fs-13: 13px; --fs-15: 15px; --fs-17: 17px; --fs-20: 20px; --fs-24: 24px; --fs-28: 28px; --fs-34: 34px; --fs-44: 44px; --fs-56: 56px;
    --halo: 0 0 3px rgba(15, 18, 21, 0.95), 0 0 14px rgba(15, 18, 21, 0.9);
    color-scheme: dark;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: #0d0f12; color: var(--chalk); font: 400 var(--fs-15)/1.45 var(--print);
    overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px dashed var(--ember); outline-offset: 3px; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #safe { position: fixed; inset: 0; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  .haptic { position: fixed; left: -100px; top: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  /* chalk: a speckled mask made at start-up (see chalkMask) roughens anything written on the board */
  .chalk { -webkit-mask-image: var(--chalk-mask); mask-image: var(--chalk-mask); -webkit-mask-size: 180px; mask-size: 180px; }

  /* ---------- HUD, written straight on the slate ---------- */
  #hud {
    position: fixed; left: 50%; top: 0; z-index: 2; pointer-events: none; box-sizing: border-box;
    width: min(100%, var(--board-w, 100%)); transform: translateX(-50%);
    padding-top: calc(env(safe-area-inset-top, 0px) + 8px);
    padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
    display: grid; grid-template-columns: 44px 1fr 96px; align-items: start; gap: 6px;
    font-family: var(--hand); line-height: 1;
  }
  #hud > * { pointer-events: auto; }
  .iconbtn { width: 44px; height: 44px; border: 0; background: none; display: grid; place-items: center; padding: 0; }
  .iconbtn svg { width: 22px; height: 22px; fill: none; stroke: var(--chalk-2); stroke-width: 2.6; stroke-linecap: round; }
  .mid { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; padding-top: 4px; }
  #chip { display: flex; align-items: center; gap: 7px; white-space: nowrap; max-width: 100%; font-size: var(--fs-24); }
  #chip.swap { animation: swap .24s cubic-bezier(.2, .8, .2, 1); }
  @keyframes swap { from { transform: translateY(-6px) rotate(-3deg); opacity: 0; } }
  #chip .ico { width: 22px; height: 22px; display: block; flex: none; }
  #chip .left { color: var(--chalk-2); font-size: var(--fs-20); }
  #streak { display: flex; align-items: center; gap: 10px; height: 34px; }
  #streak b { font-weight: 400; font-size: var(--fs-34); min-width: 2.4ch; text-align: center; transition: color .2s ease; }
  #streak.hot b { color: var(--lentil); }
  #streak.max b { color: var(--ember); }
  /* full rows in a row, as tally marks in fives on their own line, so they never read as digits */
  #tally { display: flex; gap: 7px; height: 16px; margin-top: 3px; }
  #tally svg { fill: none; stroke: var(--chalk-2); stroke-width: 2.4; stroke-linecap: round; }
  #streak.up b { animation: up .4s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes up { 35% { transform: scale(1.35) rotate(-4deg); } }
  #streak.lost { animation: lost .42s ease; }
  @keyframes lost { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  #streak.lost b { animation: lostc .9s ease; }
  @keyframes lostc { 0%, 55% { color: var(--chalk-red); } }
  /* pace: a chalk line that wears away from both ends; when it is gone the next full row counts as slow */
  #fuse { display: block; width: 132px; height: 4px; border-radius: 2px; background: var(--chalk-2); transform: scaleX(0); transition: background .25s ease; }
  #fuse[data-pace="Lightning"] { background: var(--ember); }
  #fuse[data-pace="Quick"] { background: var(--lentil); }
  #fuse[data-pace="Slow"] { background: var(--chalk-red); }
  #score { justify-self: end; text-align: right; padding-top: 4px; }
  #score b { display: block; font-weight: 400; font-size: var(--fs-34); line-height: 1; }
  #score span { color: var(--chalk-2); font-size: var(--fs-20); }
  #score span.low { color: var(--ember); }
  #score span.over { color: var(--chalk-red); }
  #score.down b { color: var(--chalk-red); }
  #tally .nw { stroke: var(--chalk); stroke-dasharray: 30; animation: draw .3s ease-out backwards; }
  @keyframes draw { from { stroke-dashoffset: 30; } }

  /* notes chalked onto the board: a dark halo instead of a box keeps them legible over grains */
  .note { position: fixed; left: 50%; z-index: 3; pointer-events: none; transform: translateX(-50%); text-align: center;
    font-family: var(--hand); line-height: 1.2; text-shadow: var(--halo); padding: 16px 30px; box-sizing: border-box;
    background: radial-gradient(closest-side, rgba(15, 18, 21, 0.9), rgba(15, 18, 21, 0.72) 62%, rgba(15, 18, 21, 0)); }
  #banner { top: calc(env(safe-area-inset-top, 0px) + 112px); opacity: 0; transform: translate(-50%, -6px) rotate(-1.5deg);
    transition: opacity .2s ease, transform .2s ease; width: max-content; max-width: min(88vw, 380px); }
  #banner.show { opacity: 1; transform: translate(-50%, 0) rotate(-1.5deg); }
  #banner b { display: block; font-weight: 400; font-size: var(--fs-34); color: var(--ember); }
  #banner span { font-size: var(--fs-20); }
  #hint { top: calc(env(safe-area-inset-top, 0px) + 112px); width: max-content; max-width: min(84vw, 360px); font-size: var(--fs-24); transition: opacity .2s ease; }
  #hint.off { opacity: 0; }
  #toast { top: calc(env(safe-area-inset-top, 0px) + 70px); z-index: 6; font-size: var(--fs-20); opacity: 0; transition: opacity .2s ease; width: max-content; max-width: min(88vw, 380px); }
  #toast.show { opacity: 1; }

  /* ---------- menus: a slate slab across the bottom ---------- */
  .screen {
    position: fixed; inset: 0; z-index: 4; display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
    background: linear-gradient(to bottom, rgba(10, 12, 15, 0) 30%, rgba(10, 12, 15, 0.8));
  }
  .screen.dim { background: rgba(10, 12, 15, 0.62); }
  .slab {
    position: relative; width: min(100%, var(--board-w, 100%)); box-sizing: border-box; background: var(--slab);
    padding: 26px max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 18px) max(20px, env(safe-area-inset-left, 0px));
    display: flex; flex-direction: column; gap: 14px; border-top: 1px solid rgba(255, 255, 255, 0.07);
    animation: rise .26s cubic-bezier(.2, .8, .2, 1);
    max-height: calc(100% - env(safe-area-inset-top, 0px) - 24px); overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .slab::before { content: ""; position: absolute; left: 18px; right: 18px; top: 11px; height: 3px; border-radius: 2px; background: var(--chalk-3);
    -webkit-mask-image: var(--chalk-mask); mask-image: var(--chalk-mask); -webkit-mask-size: 180px; mask-size: 180px; }
  @keyframes rise { from { transform: translateY(40px); opacity: 0; } }
  h1, h2 { margin: 0; font-weight: 400; text-wrap: balance; }
  h1 { font: 700 var(--fs-56)/0.95 var(--sketch); letter-spacing: 0.01em; }
  h2 { font: 400 var(--fs-34)/1.05 var(--hand); }
  .kicker { margin: 0 0 -10px; font: 400 var(--fs-20)/1.2 var(--hand); color: var(--chalk-2); }
  .lede { margin: 0; font: 400 var(--fs-24)/1.25 var(--hand); color: var(--chalk-2); }
  .primary {
    height: 58px; border: 0; border-radius: 11px 8px 12px 7px; background: var(--chalk); color: var(--slate); flex: none;
    font: 400 var(--fs-24)/1 var(--hand); display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 18px;
  }
  .primary:active { transform: scale(0.985) rotate(-0.3deg); }
  .ghost {
    min-height: 50px; border-radius: 9px 7px 10px 8px; border: 2px solid var(--chalk-3); background: transparent; padding: 0 16px;
    font: 400 var(--fs-20)/1.1 var(--hand); display: flex; align-items: center; justify-content: center; gap: 8px; flex: none;
  }
  .ghost:active { background: rgba(236, 232, 222, 0.06); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .sub { margin: 0; color: var(--chalk-2); font: 400 var(--fs-15)/1.4 var(--print); }

  /* the lobby: your stars, how far to the next board, the boards themselves */
  .purse { margin: 0; display: flex; align-items: center; gap: 10px; }
  .purse svg { width: 30px; height: 30px; fill: var(--ember); stroke: var(--ember); stroke-width: 1.2; stroke-linejoin: round; transform: rotate(-6deg); flex: none; }
  .purse b { font: 700 var(--fs-44)/1 var(--sketch); }
  .purse span { font: 400 var(--fs-20)/1.2 var(--hand); color: var(--chalk-2); }
  /* the room: the painting fills the screen; a tap anywhere sits you down at the table */
  .roomview { position: fixed; inset: 0; z-index: 3; }
  .enter { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; padding: 0; background: transparent; cursor: pointer; }
  #enterHint { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 34px); width: max-content; max-width: 90vw; font-size: var(--fs-20); transition: opacity .8s ease; }
  #enterHint.off { opacity: 0; }
  /* the title, in the dark of the ceiling above the window, lit by the lantern */
  .roomtitle { position: absolute; left: 0; right: 0; top: calc((var(--ceil, 140px) + env(safe-area-inset-top, 0px)) / 2); margin: 0;
    text-align: center; pointer-events: none; font: 400 var(--fs-56)/1 "Zen Antique Soft", "Cabin Sketch", serif; letter-spacing: 0.05em;
    color: #f8e8c8; text-shadow: 0 0 16px rgba(255, 176, 92, 0.55), 0 0 44px rgba(255, 150, 70, 0.3), 0 2px 3px rgba(0, 0, 0, 0.6);
    opacity: 0; transform: translateY(calc(-50% + 8px)); transition: opacity .45s ease, transform .45s ease; }
  .roomtitle.on { opacity: 1; transform: translateY(-50%); transition-duration: 1.6s; }
  @media (max-width: 359px) { .roomtitle { font-size: var(--fs-44); } }
  /* the table from above: your stars, the board to play on (swipe for the others), its levels as paper cards */
  .tableview { position: fixed; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; box-sizing: border-box;
    padding: calc(env(safe-area-inset-top, 0px) + 6px) 0 calc(env(safe-area-inset-bottom, 0px) + 10px); opacity: 0; transition: opacity .4s ease; }
  .tableview.show { opacity: 1; }
  .tbar { width: min(100%, 520px); display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: 0 8px; box-sizing: border-box; }
  .tbar .purse { justify-content: center; text-shadow: var(--halo); }
  .tbar .purse b { font-size: var(--fs-34); }
  .tbar .iconbtn svg { stroke: var(--chalk); filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
  .boardrail { flex: 1 1 auto; width: 100%; display: flex; align-items: center; gap: 22px; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; scrollbar-width: none; padding: 0 calc(50% - var(--face-w, 200px) / 2); box-sizing: border-box; }
  .boardrail::-webkit-scrollbar, .cardrail::-webkit-scrollbar { display: none; }
  .bslot { flex: none; position: relative; width: var(--face-w, 200px); height: var(--face-h, 430px); padding: 0; border: 0; background: none;
    scroll-snap-align: center; color: var(--chalk); font-family: var(--hand); }
  .bface { position: absolute; inset: 0; border-radius: 10px; background-size: cover; background-position: center;
    box-shadow: 0 22px 34px rgba(20, 10, 4, .5), 0 5px 10px rgba(20, 10, 4, .4); transition: transform .35s cubic-bezier(.2, .8, .2, 1), filter .35s ease; }
  .bslot:not(.here) .bface { transform: scale(.9); filter: brightness(.78); }
  .bslot.locked .bface { filter: brightness(.42) saturate(.6); }
  .bname { position: absolute; left: 14px; top: 12px; font-weight: 400; font-size: var(--fs-28); line-height: 1; }
  .bstars { position: absolute; left: 14px; bottom: 12px; display: flex; align-items: center; gap: 5px; font-size: var(--fs-20); color: var(--chalk-2); }
  .bstars svg, .block svg { width: 17px; height: 17px; fill: var(--ember); stroke: var(--ember); }
  .block { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-size: var(--fs-24); }
  .block > svg { width: 34px; height: 34px; }
  .block > span { display: flex; align-items: center; gap: 6px; }
  .rest { flex: none; margin: 8px 0 4px; padding: 4px 10px; border: 0; background: none; transform: rotate(-3deg); }
  .rest img { display: block; width: 168px; height: 28px; }
  .cardrail { flex: none; width: 100%; display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
    padding: 10px calc(50% - 38px) 8px; box-sizing: border-box; }
  /* the level cards: washi paper, ink numbers, laid on the table a little crooked */
  .lcard { flex: none; scroll-snap-align: center; width: 76px; height: 98px; border: 0; border-radius: 5px; padding: 6px 4px;
    background: linear-gradient(160deg, #f5ecd8, #e9ddc2); color: #3a2a1e; transform: rotate(var(--tilt, 0deg));
    box-shadow: 0 7px 12px rgba(25, 12, 4, .45), inset 0 0 0 1px rgba(120, 90, 50, .15);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-family: var(--hand); }
  .lcard b { font: 700 var(--fs-28)/1 var(--sketch); }
  .lcard .stars svg { width: 11px; height: 11px; stroke: #b7a588; }
  .lcard .stars svg.on { fill: #d39a2c; stroke: #d39a2c; }
  .lcard small { font-size: var(--fs-13); color: #7b6650; }
  .lcard.next { transform: rotate(var(--tilt, 0deg)) translateY(-7px); box-shadow: 0 12px 18px rgba(25, 12, 4, .5), inset 0 0 0 2px #d39a2c; }
  .lcard.locked { background: linear-gradient(160deg, #b9aa8d, #a8987a); color: #5f5140; }
  .lcard.locked svg rect, .lcard.locked svg path { fill: #6b5c47; stroke: #6b5c47; }
  .lcard.locked svg path { fill: none; }

  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .list li + li { border-top: 1px dashed rgba(236, 232, 222, 0.1); }
  .stars { display: flex; gap: 1px; }
  .stars svg { width: 17px; height: 17px; fill: none; stroke: var(--chalk-3); stroke-width: 1.7; stroke-linejoin: round; }
  .stars svg.on { fill: var(--ember); stroke: var(--ember); }
  .stars.big { gap: 6px; justify-content: center; margin: 2px 0 -2px; }
  .stars.big svg { width: 46px; height: 46px; stroke-width: 1.4; }
  .stars.big svg.stamp { animation: stamp .3s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes stamp { from { transform: scale(1.9) rotate(-14deg); opacity: 0; } }

  /* the end of a level: a tally chalked up line by line, then the score counts up and stamps the stars */
  .tally { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; font: 400 var(--fs-20)/1.3 var(--hand); }
  .tally li { display: flex; justify-content: space-between; gap: 12px; animation: write .22s ease backwards; }
  .tally li span { color: var(--chalk-2); }
  .tally li.minus b { color: var(--chalk-red); }
  .tally li b { font-weight: 400; }
  @keyframes write { from { opacity: 0; transform: translateX(-8px); } }
  .total { margin: 0; display: flex; align-items: center; gap: 12px; border-top: 2px solid var(--chalk-3); padding-top: 10px; }
  .total span { font: 400 var(--fs-20)/1 var(--hand); color: var(--chalk-2); }
  .total b { margin-left: auto; font: 700 var(--fs-44)/1 var(--sketch); }
  .total em { font: 400 var(--fs-17)/1 var(--hand); color: var(--ember); border: 2px solid var(--ember); border-radius: 50% / 46%;
    padding: 5px 10px 4px; transform: rotate(-6deg); animation: stamp .3s cubic-bezier(.3, 1.6, .5, 1) backwards; }
  .prize { margin: 0; font: 400 var(--fs-20)/1.3 var(--hand); color: var(--chalk); }
  .prize b { font-weight: 400; color: var(--ember); }

  .pairrow {
    width: 100%; display: grid; grid-template-columns: 92px 1fr auto; gap: 12px; align-items: center; min-height: 60px;
    background: transparent; border: 0; padding: 6px 4px; text-align: left;
  }
  .pairrow:active { background: rgba(236, 232, 222, 0.05); }
  .pairrow .pv { display: flex; flex-direction: column; gap: 5px; }
  .pairrow .pv i { display: block; height: 8px; clip-path: polygon(0 32%, 100% 0, 100% 100%, 0 68%); border-radius: 2px; }
  .pairrow .nm { min-width: 0; font: 400 var(--fs-20)/1.15 var(--hand); }
  .pairrow .nm small { display: block; color: var(--chalk-2); font: 400 var(--fs-13)/1.3 var(--print); margin-top: 2px; }
  .pairrow .st { font: 400 var(--fs-17)/1 var(--hand); color: var(--chalk-2); white-space: nowrap; }
  .pairrow.on .st { color: var(--ember); }
  .pairrow.locked .pv, .pairrow.locked .nm b { opacity: 0.4; }

  #tuneList { display: flex; flex-direction: column; gap: 6px; }
  .trow { display: grid; grid-template-columns: 1fr 64px; gap: 4px 10px; align-items: center; }
  .trow label { font-size: var(--fs-13); color: var(--chalk-2); }
  .trow output { text-align: right; font-variant-numeric: tabular-nums; font-size: var(--fs-13); }
  .trow input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--lentil); }
  .check { display: flex; align-items: center; gap: 10px; font-size: var(--fs-15); min-height: 40px; }
  .check input { width: 20px; height: 20px; accent-color: var(--lentil); }
  #tuneJson { width: 100%; box-sizing: border-box; background: #0d0f12; color: var(--chalk); border: 1px solid var(--chalk-3); border-radius: 10px; font: 12px ui-monospace, Menlo, monospace; }

  @media (prefers-reduced-motion: reduce) {
    .slab, #chip.swap, .stars.big svg.stamp, #streak.up b, #streak.lost, #streak.lost b, .tally li, .total em, #tally .nw { animation: none; }
    #hint, #toast, #banner, #fuse, #streak b, .tableview, #enterHint, .bface, .roomtitle { transition: none; }
    .roomtitle, .roomtitle.on { transform: translateY(-50%); }
  }
</style>

</head>
<body>
<canvas id="game" aria-label="Game board"></canvas>
<div id="safe"></div>

<div id="hud" hidden>
  <button id="menuBtn" class="iconbtn" aria-label="Pause"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M7.6 4.2c.2 4.6-.1 9.2.3 13.6M14.6 4.4c-.3 4.4.1 9 .1 13.4"/></svg></button>
  <div class="mid">

<script>
// ===== GRAIN-SIM BEGIN =====
// Pure, seeded simulation: no DOM, no Math.random, no Date. Fixed step. The board is W units wide, seen from
// above; nothing falls. Grains of the row's kind walk in single file into the open sticks, the sticks' sides
// shove other grains aside, and every finished row is poured onto its kind's pile in a bottom corner.
const GrainSim = (() => {
  'use strict';

  const W = 600;
  const ST = { REST: 0, WALK: 1, ROW: 2, SLIDE: 3, POUR: 4, GONE: 5 };

  const DEFAULTS = {
    stepHz: 120,
    fingerOffset: 180,   // the tips sit this far above the finger, so the thumb never hides them
    followOmega: 28,     // tip spring, critically damped (1/s)
    zoneR: 160,          // reach: grains of the row's kind inside it walk in
    creepR: 100,         // grains of another kind this close to the tips creep in
    fieldAhead: 0.45,    // both circles sit this share of their radius in front of the tips, away from the thumb
    fieldCone: 180,      // half-angle in degrees the sticks pull from; 180 = all around
    callInterval: 0.07,  // a new grain joins the file at most this often (s)
    maxTrail: 10,        // grains walking at once
    walkSpeed: 520,      // lead grain speed (units/s)
    catchUp: 1.7,        // followers move faster to close gaps in the file
    creepSpeed: 55,      // how fast a wrong grain creeps toward the tips (units/s)
    loseDist: 2.4,       // a walking grain stops when the tips are this many reaches away
    channelLen: 330,     // how much row fits between the sticks
    enterTime: 0.16,
    enterDist: 900,
    closeTime: 0.08,
    carryTime: 0.34,     // the closed sticks carry the row to its pile
    pourTime: 0.2,
    pourStagger: 0.016,
    retractSpeed: 6000,
    breakScatter: 120,   // how far a broken row scatters (units)
    friction: 7,         // sliding grains slow down (1/s)
    flick: 0.55,         // share of the sticks' sideways speed a shoved grain keeps
    drift: 0,            // loose grains wander this fast (units/s); 0 = they stay put
    solid: 1,            // 1 = loose grains are solid against each other; 0 = they pass through each other
    paceBase: 1.4, pacePerGrain: 0.12,   // seconds a quick row of n grains takes: paceBase + pacePerGrain × n
    paceK: 1,            // scales that pace; above 1 is more forgiving
    parBase: 8, parPerGrain: 0.5, parPerRow: 1.4,   // the level clock
    stickSpread: 0.04,   // the channel widens toward the hand
    leanK: 0.45,         // how far the hand follows the tips sideways
    baseBelow: 420,      // the hand sits this far below the board
  };
  const STICK = { len: 1500, tipW: 7, baseW: 24 };

  // rx is the long half-axis; every grain is drawn with its long axis along its rotation.
  const TYPES = {
    lentil: { label: 'Lentils', one: 'lentil', rx: 13, ry: 11.5, pitch: 25, gap: 34, size: 12 },
    rice: { label: 'Rice', one: 'rice grain', rx: 17, ry: 6.5, pitch: 34, gap: 22, size: 10.5 },
    mung: { label: 'Mung beans', one: 'mung bean', rx: 11.5, ry: 8.5, pitch: 23, gap: 26, size: 9.5 },
    // stones are never sorted: they cannot be picked, have no pile, go for the open tips from almost the whole reach
    // and a little faster than wrong grains do, and they are heavy to shove; they stay on the board all round
    stone: { label: 'Stones', one: 'stone', rx: 12.5, ry: 10.5, pitch: 25, gap: 30, size: 11.5, stone: true, mass: 2.4, creepK: 1.3, reachK: 0.95 },
  };

  // Score. Every row pays (grains × 10, plus 100 for a full row or 50 for clearing a kind) times the multiplier.
  // The multiplier starts at ×1 and only grows with full rows: each one adds more the longer the combo of full rows
  // in a row and the faster it was pulled. A short row keeps the multiplier but shrinks it and ends the combo.
  // A wrong grain getting in drops the multiplier to ×1, ends the combo and costs points.
  const SCORE = {
    grain: 10, full: 100, clear: 50, breakPenalty: 50, noBreaks: 0.2, perSecond: 25,
    growth: 0.3, comboStep: 0.2, comboCap: 10, shortDecay: 0.85, maxMult: 10,
    stars: [0.15, 0.3, 0.45, 0.62, 0.8],     // share of the perfect run each star needs
  };
  const MILESTONES = { 5: { name: 'Steady hands', bonus: 500 }, 10: { name: 'Grain master', bonus: 1500 }, 15: { name: 'Zen hands', bonus: 3000 } };
  // how long a quick row of n grains takes, and how fast this one was against it
  function paceFor(n, cfg) { return (cfg.paceBase + cfg.pacePerGrain * n) * cfg.paceK; }
  function speedFactor(ratio) { return Math.max(0.2, Math.min(1.6, 1.8 - 0.75 * ratio)); }
  function speedLabel(ratio) { return ratio < 0.75 ? 'Lightning' : ratio < 1.25 ? 'Quick' : ratio < 2 ? 'Steady' : 'Slow'; }
  // how much a full (or clearing) row adds to the multiplier: combo is the count of full rows in a row, this one included
  function multGain(combo, ratio, kind) {
    return SCORE.growth * (1 + SCORE.comboStep * Math.min(combo - 1, SCORE.comboCap)) * speedFactor(ratio) * (kind === 'clear' ? 0.5 : 1);
  }
  // kind: 'full' | 'clear' | 'short'
  function rowPoints(n, kind, mult) {
    return Math.round((n * SCORE.grain + (kind === 'full' ? SCORE.full : kind === 'clear' ? SCORE.clear : 0)) * mult);
  }

  // Pile coordinates are fractions of the playable board; depth and r are fractions of its width.
  // The bottom corners are kept free: that is where the sorted piles grow.
  // tune overrides feel numbers for one level. After these, levels are generated without end.
  const AUTHORED = [
    {
      id: 'first-row', name: 'First row', seed: 11, types: ['lentil'],
      hint: ['Touch and hold. The lentils walk into the sticks.', 'Fill the row to grow your multiplier.'],
      tune: { paceK: 2 },

    {
      id: 'two-heaps', name: 'Two heaps', seed: 23, types: ['lentil', 'rice'],
      hint: ['After every row the sticks switch to the other kind.'],
      tune: { paceK: 1.6 },
      piles: [
        { type: 'lentil', kind: 'blob', cx: 0.3, cy: 0.3, r: 0.12, count: 22 },
        { type: 'rice', kind: 'blob', cx: 0.7, cy: 0.52, r: 0.12, count: 18 },
      ],
    },
    {
      id: 'touching', name: 'Touching', seed: 37, types: ['lentil', 'rice'], hintRows: 2,
      hint: ['Rice next to the tips creeps in. Push it aside with the side of the sticks.'],
      tune: { paceK: 1.3 },
      piles: [
        { type: 'lentil', kind: 'blob', cx: 0.42, cy: 0.36, r: 0.14, count: 24 },
        { type: 'rice', kind: 'blob', cx: 0.6, cy: 0.48, r: 0.13, count: 20 },
      ],
    },
    {
      id: 'strays', name: 'Strays', seed: 41, types: ['lentil', 'rice'], hintRows: 2,
      hint: ['The line under the multiplier wears away. Fill the row before it is gone.', 'A short row keeps the multiplier but shrinks it.'],
      tune: { zoneR: 150, paceK: 1.15 },
      piles: [
        { type: 'lentil', kind: 'blob', cx: 0.32, cy: 0.3, r: 0.14, count: 20 },
        { type: 'rice', kind: 'blob', cx: 0.66, cy: 0.42, r: 0.14, count: 18 },
        { type: 'lentil', kind: 'scatter', x0: 0.06, x1: 0.94, y0: 0.06, y1: 0.8, count: 8 },
        { type: 'rice', kind: 'scatter', x0: 0.06, x1: 0.94, y0: 0.06, y1: 0.8, count: 8 },
      ],
    },
    {
      id: 'the-slate', name: 'The slate', seed: 53, types: ['lentil', 'rice'],
      tune: { zoneR: 145 },
      piles: [
        { type: 'lentil', kind: 'edge', side: 'top', from: 0, to: 0.66, depth: 0.12, count: 26 },
        { type: 'rice', kind: 'edge', side: 'top', from: 0.54, to: 1, depth: 0.1, count: 14 },
        { type: 'lentil', kind: 'edge', side: 'left', from: 0.1, to: 0.6, depth: 0.1, count: 12 },
        { type: 'rice', kind: 'scatter', x0: 0.25, x1: 0.95, y0: 0.08, y1: 0.7, count: 10 },
        { type: 'lentil', kind: 'scatter', x0: 0.1, x1: 0.75, y0: 0.15, y1: 0.65, count: 6 },
      ],
    },
    {
      id: 'short-reach', name: 'Short reach', seed: 59, types: ['lentil', 'rice'], rule: 'Short reach',
      ruleText: 'The sticks pull from close by. Drive the tips through the grains.',
      tune: { zoneR: 105, creepR: 70 },
      piles: [
        { type: 'lentil', kind: 'scatter', x0: 0.05, x1: 0.95, y0: 0.05, y1: 0.8, count: 22 },
        { type: 'rice', kind: 'scatter', x0: 0.05, x1: 0.95, y0: 0.05, y1: 0.8, count: 18 },
        { type: 'lentil', kind: 'blob', cx: 0.25, cy: 0.25, r: 0.08, count: 6 },
        { type: 'rice', kind: 'blob', cx: 0.75, cy: 0.55, r: 0.08, count: 6 },
      ],
    },
    {
      id: 'mixed-heap', name: 'Mixed heap', seed: 67, types: ['lentil', 'rice'], rule: 'Pushy rice',
      ruleText: 'Rice creeps in from further away. Sweep the heap apart, then gather.',
      tune: { zoneR: 135, creepR: 115, creepSpeed: 80 },
      piles: [
        { type: 'lentil', kind: 'blob', cx: 0.46, cy: 0.42, r: 0.21, count: 26 },
        { type: 'rice', kind: 'blob', cx: 0.55, cy: 0.47, r: 0.21, count: 22 },
      ],
    },
    {
      id: 'mung-beans', name: 'Mung beans', seed: 71, types: ['lentil', 'rice', 'mung'],
      hint: ['A third kind, with its own pile in the middle.'],
      tune: { zoneR: 140 },
      piles: [
        { type: 'lentil', kind: 'blob', cx: 0.28, cy: 0.26, r: 0.12, count: 17 },
        { type: 'rice', kind: 'blob', cx: 0.72, cy: 0.3, r: 0.12, count: 15 },
        { type: 'mung', kind: 'blob', cx: 0.5, cy: 0.58, r: 0.12, count: 16 },
        { type: 'lentil', kind: 'scatter', x0: 0.1, x1: 0.9, y0: 0.1, y1: 0.75, count: 4 },
        { type: 'rice', kind: 'scatter', x0: 0.1, x1: 0.9, y0: 0.1, y1: 0.75, count: 4 },
        { type: 'mung', kind: 'scatter', x0: 0.1, x1: 0.9, y0: 0.1, y1: 0.75, count: 4 },
      ],
    },
    {
      id: 'restless', name: 'Restless', seed: 79, types: ['lentil', 'rice'], rule: 'Restless grains',
      ruleText: 'They wander and mix again. Sort them before they spread.',
      tune: { zoneR: 130, drift: 22 },
      piles: [
        { type: 'lentil', kind: 'blob', cx: 0.3, cy: 0.32, r: 0.14, count: 22 },
        { type: 'rice', kind: 'blob', cx: 0.7, cy: 0.38, r: 0.14, count: 20 },
        { type: 'lentil', kind: 'scatter', x0: 0.1, x1: 0.9, y0: 0.5, y1: 0.8, count: 6 },
        { type: 'rice', kind: 'scatter', x0: 0.1, x1: 0.9, y0: 0.05, y1: 0.3, count: 6 },
      ],
    },
    {
      id: 'pantry-spill', name: 'Pantry spill', seed: 89, types: ['lentil', 'rice', 'mung'], rule: 'Short reach, restless',
      ruleText: 'Close reach and wandering grains, all three kinds.',
      tune: { zoneR: 118, creepR: 85, drift: 14 },
      piles: [
        { type: 'lentil', kind: 'blob', cx: 0.42, cy: 0.38, r: 0.17, count: 18 },
        { type: 'rice', kind: 'blob', cx: 0.58, cy: 0.42, r: 0.17, count: 17 },
        { type: 'mung', kind: 'blob', cx: 0.5, cy: 0.58, r: 0.17, count: 17 },
        { type: 'lentil', kind: 'scatter', x0: 0.05, x1: 0.95, y0: 0.05, y1: 0.8, count: 4 },
        { type: 'rice', kind: 'scatter', x0: 0.05, x1: 0.95, y0: 0.05, y1: 0.8, count: 4 },
        { type: 'mung', kind: 'scatter', x0: 0.05, x1: 0.95, y0: 0.05, y1: 0.8, count: 4 },
      ],
    },
  ];

  // ---------- endless levels ----------
  // After the authored ones, every level is built from a seed. A difficulty number d climbs toward 1 and never
  // quite gets there: wrong grains pull harder and from further away, the reach shrinks, layouts mix more,
  // rows get longer, and the clocks get tighter. Layout styles and twists rotate on top.
  const ARCH = { heaps: 'Heaps', spill: 'Spill', edges: 'Edges', stripes: 'Stripes', clusters: 'Clusters' };
  const TWIST = {
    restless: { name: 'Restless grains', text: 'They wander and mix again. Sort them before they spread.' },
    short: { name: 'Short reach', text: 'The sticks pull from close by. Drive the tips through the grains.' },
    narrow: { name: 'Narrow reach', text: 'The sticks only pull from straight ahead. Come at grains from below.' },
  };
  // every other level gets a twist as its own flavour; the climb itself never pauses for it
  const TWIST_ORDER = ['restless', null, 'short', null, 'narrow', null];
  const PAIRS = [['lentil', 'rice'], ['lentil', 'mung'], ['rice', 'mung']];
  // Boards: the hand-made levels on slate, then one board for each new idea, then the endless climb. A board opens
  // once you hold enough stars in total; its first level brings in what is new on it and nothing else.
  const BOARDS = [
    { id: 'slate', name: 'Slate', first: 0, count: 10, stars: 0 },
    { id: 'walnut', name: 'Walnut', first: 10, count: 10, stars: 25, adds: 'stones',
      intro: { name: 'Stones', text: 'They can\u2019t be picked, and they go for the tips. Push them aside.' } },
    { id: 'iron', name: 'Cast iron', first: 20, count: Infinity, stars: 50, endless: true },
  ];
  function boardOf(i) { let b = BOARDS[0]; for (const B of BOARDS) if (i >= B.first) b = B; return b; }
  const hasStones = (i) => BOARDS.some((B) => B.adds === 'stones' && i >= B.first);
  // Endless levels climb one step at a time. A single pressure number rises with every level and drives every
  // lever the same way: wrong grains creep faster and from further out, the kinds lie more mixed, there are more
  // grains, rows get longer and the clock and pace tighter. Three kinds from the fifth generated level on.
  function difficulty(i) { const k = i - AUTHORED.length + 1; return k <= 0 ? 0 : 1 - Math.pow(0.5, k / 12); }
  // mix runs from 0 (each kind on its own) to 2: past 0.7 a growing share of every kind goes into one shared, mixed
  // heap, the way a spilled jar looks; that is what lets every layout reach a properly mixed board
  function buildPiles(arch, types, all, mixIn, rng) {
    const shared = Math.min(0.55, Math.max(0, mixIn - 0.7) * 0.45), mix = Math.min(1.1, mixIn);
    const n = types.length, total = Math.round(all * (1 - shared)), per = Math.floor(total / n), piles = [];
    const scatter = Math.round(per * (0.1 + 0.3 * mix));
    const add = (p) => { if (p.count > 0) piles.push(p); };
    if (arch === 'heaps') {
      const a0 = rng() * Math.PI * 2, sep = Math.max(0.02, 0.3 * (1 - mix) + 0.06);
      types.forEach((t, j) => {
        const a = a0 + (j * Math.PI * 2) / n;
        add({ type: t, kind: 'blob', cx: 0.5 + Math.cos(a) * sep, cy: 0.4 + Math.sin(a) * sep * 0.8, r: 0.16, count: per - scatter });
        add({ type: t, kind: 'scatter', x0: 0.06, x1: 0.94, y0: 0.05, y1: 0.8, count: scatter });
      });
    } else if (arch === 'spill') {
      types.forEach((t) => {
        const loose = Math.round(per * Math.min(0.95, 0.45 + 0.35 * mix));
        add({ type: t, kind: 'scatter', x0: 0.05, x1: 0.95, y0: 0.04, y1: 0.82, count: loose });
        add({ type: t, kind: 'blob', cx: 0.15 + rng() * 0.7, cy: 0.1 + rng() * 0.6, r: 0.1, count: per - loose });
      });
    } else if (arch === 'edges') {
      const sides = [['top', 0, Math.min(1, 0.5 + 0.4 * mix)], ['top', Math.max(0, 0.5 - 0.4 * mix), 1], ['left', 0.05, 0.75]];
      types.forEach((t, j) => {
        const [side, from, to] = sides[j];
        add({ type: t, kind: 'edge', side, from, to, depth: 0.12, count: per - scatter });
        add({ type: t, kind: 'scatter', x0: 0.1, x1: 0.9, y0: 0.08, y1: 0.78, count: scatter });
      });
    } else if (arch === 'stripes') {
      const bands = 4 + Math.floor(rng() * 2), h = 0.74 / bands, stray = Math.min(0.5, 0.3 * mix);
      for (let b = 0; b < bands; b++) {
        const y0 = 0.05 + b * h;
        add({ type: types[b % n], kind: 'scatter', x0: 0.05, x1: 0.95, y0, y1: Math.min(0.85, y0 + h * (0.5 + mix)), count: Math.round((total / bands) * (1 - stray)) });
      }
      types.forEach((t) => add({ type: t, kind: 'scatter', x0: 0.06, x1: 0.94, y0: 0.05, y1: 0.8, count: Math.round((total * stray) / n) }));
    } else {
      const cells = [];
      for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) cells.push([0.2 + c * 0.3 + (rng() - 0.5) * 0.08, 0.12 + r * 0.28 + (rng() - 0.5) * 0.06]);
      // each cluster is mostly one kind; with more mix, more of the next kind is stirred into it
      const each = total / cells.length, other = Math.min(0.5, 0.42 * mix);
      cells.forEach(([cx, cy], j) => {
        add({ type: types[j % n], kind: 'blob', cx, cy, r: 0.07 + 0.06 * mix, count: Math.round(each * (1 - other)) });
        add({ type: types[(j + 1) % n], kind: 'blob', cx, cy, r: 0.07 + 0.06 * mix, count: Math.round(each * other) });
      });
    }
    if (shared > 0) {
      const cx = 0.3 + rng() * 0.4, cy = 0.2 + rng() * 0.35;
      types.forEach((t) => add({ type: t, kind: 'blob', cx, cy, r: 0.11 + 0.05 * shared, count: Math.round((all * shared) / n) }));
    }
    // rounding gains or loses a grain here and there: settle it with the kinds in turn, so every level has exactly
    // its grains
    let have = piles.reduce((a, p) => a + p.count, 0);
    for (let k = 0; have !== all && k < 400; k++) {
      const t = types[k % n], more = have < all;
      for (let j = piles.length - 1; j >= 0; j--) {
        if (piles[j].type !== t || (!more && piles[j].count <= 1)) continue;
        piles[j].count += more ? 1 : -1; have += more ? 1 : -1; break;
      }
    }
    return piles;

    // where the mouth and the stick direction would be with the tips at (tx, ty): lets a planner test an aim
    sim.geomAt = function (tx, ty) {
      const bx = W / 2 + (tx - W / 2) * cfg.leanK, by = sim.H + cfg.baseBelow;
      let ux = tx - bx, uy = ty - by;
      const l = Math.hypot(ux, uy) || 1; ux /= l; uy /= l;
      return { mx: tx + ux * 6, my: ty + uy * 6, ux, uy };
    };
    sim.inFieldAt = (x, y, G, R) => inField(x, y, G, R);

    function follow(ax, ay, dt) {
      const w = cfg.followOmega;
      S.vx += (w * w * (ax - S.tx) - 2 * w * S.vx) * dt;
      S.vy += (w * w * (ay - S.ty) - 2 * w * S.vy) * dt;
      S.tx += S.vx * dt; S.ty += S.vy * dt;
    }
    function approachGap(target, rate, dt) { S.gap += (target - S.gap) * (1 - Math.exp(-rate * dt)); }
    function computeCarryTo() {
      const a = axis();
      S.carryTo = S.carry + Math.max(700, (sim.H + 80 - S.ty) / Math.max(0.25, -a.uy) + cfg.channelLen + 80);
    }
    function dropTrail() {
      for (const id of S.trail) sim.grains[id].st = ST.REST;
      S.trail = [];
    }
    function beginEnter(ax, ay) {
      S.phase = 'enter'; S.pt = 0; S.tx = ax; S.ty = ay; S.vx = 0; S.vy = 0; S.carry = cfg.enterDist;
      S.gap = 3; S.row = []; S.trail = []; S.callT = 0; S.kind = 'short'; S.rowType = sim.target;
      S.cap = sim.caps[sim.target];
      S.need = Math.min(S.cap, sim.remaining(sim.target));
      if (!sim.started) { sim.started = true; emit('clock_start', { par: sim.par }); }
      emit('sticks_in', { grain: sim.target });
    }
    function startClose() {
      const n = S.row.length;
      S.kind = n >= S.cap ? 'full' : n >= S.need ? 'clear' : 'short';
      S.phase = 'close'; S.pt = 0; dropTrail(); sim.waitLift = true;
      emit('close', { n, kind: S.kind, full: S.kind !== 'short', grain: S.rowType });
    }
    function startRetract() {
      dropTrail(); S.phase = 'retract'; S.pt = 0; computeCarryTo();
    }
    function startCarry() {
      const type = S.rowType, st = sim.stores[type], n = S.row.length;
      const mid = slotPos(st, st.n + Math.floor(n / 2));
      const G = sim.geom();
      const depth = sim.slot0(type) + ((n - 1) * TYPES[type].pitch) / 2;
      const rcx = G.Tx - G.ux * depth, rcy = G.Ty - G.uy * depth;
      const tx = mid.x + (W / 2 - mid.x) * 0.18, ty = mid.y - 130;
      S.cx0 = S.tx; S.cy0 = S.ty; S.cdx = tx - rcx; S.cdy = ty - rcy; S.vx = 0; S.vy = 0;
      S.phase = 'carry'; S.pt = 0;
      emit('carry', { n, grain: type });
    }
    function startPour() {
      const type = S.rowType, st = sim.stores[type], ids = S.row.slice().reverse(), n = ids.length;
      S.row = [];
      ids.forEach((id, i) => {
        const g = sim.grains[id], p = slotPos(st, st.n);
        g.st = ST.POUR; g.slot = st.n; st.n++; st.ids.push(id);
        g.pt = -i * cfg.pourStagger; g.ax = g.x; g.ay = g.y; g.arot = g.rot; g.bx = p.x; g.by = p.y; g.brot = p.rot;
      });
      const kind = S.kind, before = sim.mult;
      const rowTime = sim.clock - sim.lastPull, ratio = rowTime / paceFor(n, cfg), speed = speedLabel(ratio);
      sim.lastPull = sim.clock;
      let points, milestone = null, bonus = 0, gain = 0;
      if (kind !== 'short') {
        sim.combo++;
        gain = multGain(sim.combo, ratio, kind);
        sim.mult = Math.min(SCORE.maxMult, sim.mult + gain);
        points = rowPoints(n, kind, sim.mult);
        const ms = MILESTONES[sim.combo];
        if (ms) { milestone = ms.name; bonus = ms.bonus; points += bonus; }
        sim.stats.fullRows++;
      } else {
        points = rowPoints(n, kind, sim.mult);
        sim.combo = 0;
        sim.mult = Math.max(1, sim.mult * SCORE.shortDecay);
      }
      sim.score += points;
      sim.stats.rowPts += points - bonus; sim.stats.comboPts += bonus;
      sim.bestCombo = Math.max(sim.bestCombo, sim.combo);
      sim.bestMult = Math.max(sim.bestMult, sim.mult);
      sim.stats.rows++;
      sim.stats.taken[type] = (sim.stats.taken[type] || 0) + n;
      const hp = slotPos(st, Math.max(0, st.n - Math.ceil(n / 2)));
      const cleared = sim.remaining(type) === 0;
      emit('row_taken', {
        grain: type, n, kind, full: kind !== 'short', cleared, points, rowTime, speed, gain,
        multBefore: before, mult: sim.mult, combo: sim.combo, milestone, bonus, score: sim.score, x: hp.x, y: hp.y,
      });
      S.phase = 'pour'; S.pt = 0;
      if (sim.remaining() === 0) finish(); else switchTarget();
    }
    function finish() {
      sim.done = true;
      const noBreak = sim.stats.breaks === 0 ? Math.round(sim.score * SCORE.noBreaks) : 0;
      const left = Math.max(0, Math.ceil(sim.timeLeft()));
      const timeBonus = left * SCORE.perSecond;
      sim.score += noBreak + timeBonus;
      sim.result = {
        score: sim.score, ideal: sim.ideal, stars: starsFor(sim.score, sim.ideal), bestCombo: sim.bestCombo, bestMult: sim.bestMult,
        fullRows: sim.stats.fullRows, rows: sim.stats.rows, breaks: sim.stats.breaks, penalty: sim.stats.penalty, noBreak,
        rowPts: sim.stats.rowPts, comboPts: sim.stats.comboPts,
        time: sim.clock, par: sim.par, timeBonus, sorted: Object.values(sim.stats.taken).reduce((a, b) => a + b, 0),
      };
      emit('level_complete', sim.result);
    }

    function breakRow(bad, G) {
      const lost = S.row.concat(S.trail);
      lost.push(bad.id);
      const base = Math.atan2(G.uy, G.ux);
      for (const id of lost) {
        const g = sim.grains[id];
        const ang = base + (rng() - 0.5) * 2.6;
        const v = cfg.breakScatter * cfg.friction * (0.45 + rng() * 0.8);
        g.st = ST.SLIDE; g.vx = Math.cos(ang) * v; g.vy = Math.sin(ang) * v; g.w = (rng() - 0.5) * 18; g.warn = 0;
      }
      const inRow = S.row.length, comboLost = sim.combo, multLost = sim.mult;
      const penalty = Math.min(sim.score, Math.round(SCORE.breakPenalty * sim.mult));
      S.row = []; S.trail = [];
      sim.combo = 0; sim.mult = 1; sim.score -= penalty; sim.lastPull = sim.clock;
      sim.stats.rows++; sim.stats.breaks++; sim.stats.penalty += penalty;
      S.phase = 'snap'; S.pt = 0; sim.waitLift = true;
      emit('break', { id: bad.id, wrong: bad.type, grain: S.rowType, x: bad.x, y: bad.y, lost: lost.length, inRow, comboLost, multLost, penalty, score: sim.score });
    }

    // the sticks are solid on the board: their sides shove loose grains out of the way
    function pushGrains(G) {
      const L = STICK.len, tw = STICK.tipW, bw = STICK.baseW;
      let n = 0;
      for (const g of sim.grains) {
        if (g.st !== ST.REST && g.st !== ST.SLIDE) continue;
        const rx = g.x - G.Tx, ry = g.y - G.Ty;
        const a = -(rx * G.ux + ry * G.uy);                  // depth behind the tip line
        if (a < 0 || a > L) continue;                        // in front of the tips is the open mouth
        const c = rx * G.nx + ry * G.ny, r = TYPES[g.type].size * 0.85;
        const hw = G.gap / 2 + G.spread * a + tw + ((bw - tw) * a) / L;
        if (c >= hw + r || c <= -(hw + r)) continue;
        const side = c > 0 ? 1 : c < 0 ? -1 : (g.id & 1 ? 1 : -1);
        const d = side * (hw + r) - c;
        g.x += G.nx * d; g.y += G.ny * d; g.pk = sim.steps;
        if (ELONG[g.type] > 0.5) g.rot = turn(g.rot, Math.atan2(G.uy, G.ux), 0.12);   // a long grain swings round along the stick
        const vn = (S.vx * G.nx + S.vy * G.ny) * side;
        if (vn > 80) {                                      // a quick sweep flicks grains away
          const k = vn * cfg.flick;
          g.st = ST.SLIDE;
          g.vx = G.nx * side * k + S.vx * 0.15; g.vy = G.ny * side * k + S.vy * 0.15;
          g.w = (g.id % 2 ? 1 : -1) * Math.min(20, vn / 120);
        }
        n++;
      }
      return n;
    }

    function gather(dt) {
      const G = sim.geom(), mx = G.mx, my = G.my, R = cfg.zoneR;
      const type = S.rowType;
      // 1) grains of another kind in the creep field drift toward the tips; one reaching them breaks the row
      for (const g of sim.grains) {
        if (g.st !== ST.REST || g.type === type) continue;
        const T = TYPES[g.type], CR = T.reachK ? Math.max(cfg.creepR, R * T.reachK) : cfg.creepR, span = CR * (1 + cfg.fieldAhead);
        if (!inField(g.x, g.y, G, CR)) continue;
        const dx = mx - g.x, dy = my - g.y, d = Math.hypot(dx, dy) || 1e-6, close = clamp(1 - d / span, 0, 1);
        g.warn = Math.max(0.15, close); g.cw = true;
        if (d < T.ry * 0.5 + 9) { breakRow(g, G); return; }
        const m = Math.min(cfg.creepSpeed * (T.creepK || 1) * (0.6 + 0.9 * close) * dt, d);
        g.x += (dx / d) * m; g.y += (dy / d) * m;
        g.pk = sim.steps;     // a creeping grain shoulders through the crowd: packing a heap never shields the tips
      }
      // 2) call the next grain of the row's kind: the nearest one to the end of the file
      S.callT -= dt;
      if (S.callT <= 0 && S.trail.length < cfg.maxTrail && S.row.length + S.trail.length < S.need) {
        let fx = mx, fy = my;
        if (S.trail.length) { const tail = sim.grains[S.trail[S.trail.length - 1]]; fx = tail.x; fy = tail.y; }
        let best = null, bd = Infinity;
        for (const g of sim.grains) {
          if (g.st !== ST.REST || g.type !== type) continue;
          if (!inField(g.x, g.y, G, R)) continue;
          const ex = g.x - fx, ey = g.y - fy, e2 = ex * ex + ey * ey;
          if (e2 < bd) { bd = e2; best = g; }
        }
        if (best) { best.st = ST.WALK; S.trail.push(best.id); S.callT = cfg.callInterval; emit('call', { id: best.id }); }
      }
      // 3) the file walks: the lead heads for the tips, every other grain follows the one ahead of it
      const lose2 = Math.pow(R * cfg.loseDist, 2), spacing = TYPES[type].pitch * 1.05;
      for (let k = 0; k < S.trail.length; k++) {
        const g = sim.grains[S.trail[k]];
        let tx = mx, ty = my, want = 0, sp = cfg.walkSpeed;
        if (k > 0) { const p = sim.grains[S.trail[k - 1]]; tx = p.x; ty = p.y; want = spacing; sp *= cfg.catchUp; }
        const dx = tx - g.x, dy = ty - g.y, d = Math.hypot(dx, dy);
        const m = Math.min(sp * dt, Math.max(0, d - want));
        if (d > 1e-6) { g.hx = dx / d; g.hy = dy / d; }
        if (d > 1e-6 && m > 0) { g.x += (dx / d) * m; g.y += (dy / d) * m; g.rot = turn(g.rot, Math.atan2(dy, dx), 14 * dt); }
        const ox = g.x - mx, oy = g.y - my;
        if (ox * ox + oy * oy > lose2) { g.st = ST.REST; S.trail.splice(k, 1); k--; }
      }
      // 4) the lead slots in at the tips and the row ratchets one place deeper
      if (S.trail.length) {
        const g = sim.grains[S.trail[0]];
        if (Math.hypot(g.x - mx, g.y - my) < 7) {
          S.trail.shift(); g.st = ST.ROW; g.d = -4; S.row.unshift(g.id);
          emit('slot', { id: g.id, index: S.row.length - 1, n: S.row.length, need: S.need, cap: S.cap, grain: type });
        }
      }
    }

    function placeRow(dt) {
      if (!S.row.length) return;
      const G = sim.geom(), T = TYPES[S.rowType], slot0 = sim.slot0(S.rowType), rot = Math.atan2(G.uy, G.ux);
      const k = 1 - Math.exp(-38 * dt);
      for (let i = 0; i < S.row.length; i++) {
        const g = sim.grains[S.row[i]];
        g.d += (slot0 + i * T.pitch - g.d) * k;
        g.x = G.Tx - G.ux * g.d; g.y = G.Ty - G.uy * g.d; g.rot = rot;
      }
    }

    // The board has a slightly raised rim: a grain left against an edge or a pile rolls slowly back toward the
    // middle, so the last grains of a level never jam into a corner where the sticks cannot get between them.
    const RIM = 22, RIM_V = 40;
    function rim(g, B, dt) {
      let ix = 0, iy = 0;
      if (g.x < B.x0 + RIM) ix = 1; else if (g.x > B.x1 - RIM) ix = -1;
      if (g.y < B.y0 + RIM) iy = 1; else if (g.y > B.y1 - RIM) iy = -1;
      for (const k in sim.stores) {
        const st = sim.stores[k], dx = g.x - st.x, dy = g.y - st.y, far = st.r + TYPES[g.type].size + 16 + RIM;
        if (dx * dx + dy * dy >= far * far) continue;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d > 1e-6) { ix += dx / d; iy += dy / d; }
      }
      const l = Math.hypot(ix, iy);
      if (l > 0) { g.x += (ix / l) * RIM_V * dt; g.y += (iy / l) * RIM_V * dt; }
    }

    function updateFree(dt) {
      const f = Math.exp(-cfg.friction * dt), B = bounds();
      for (const g of sim.grains) {
        if (g.st === ST.SLIDE) {
          g.vx *= f; g.vy *= f; g.x += g.vx * dt; g.y += g.vy * dt; g.rot += g.w * dt; g.w *= f;
          if (g.x < B.x0) { g.x = B.x0; g.vx = Math.abs(g.vx) * 0.4; } else if (g.x > B.x1) { g.x = B.x1; g.vx = -Math.abs(g.vx) * 0.4; }
          if (g.y < B.y0) { g.y = B.y0; g.vy = Math.abs(g.vy) * 0.4; } else if (g.y > B.y1) { g.y = B.y1; g.vy = -Math.abs(g.vy) * 0.4; }
          keepOffStores(g, sim.stores);
          if (g.vx * g.vx + g.vy * g.vy < 100) { g.st = ST.REST; g.vx = 0; g.vy = 0; g.w = 0; }
        } else if (g.st === ST.REST) {
          if (cfg.drift > 0 && !g.cw && !TYPES[g.type].stone) {    // restless grains: a slow wander with a turning heading
            if (g.hd === undefined) g.hd = rng() * Math.PI * 2;
            g.hd += (rng() - 0.5) * 6 * dt;
            g.x += Math.cos(g.hd) * cfg.drift * dt; g.y += Math.sin(g.hd) * cfg.drift * dt;
            if (g.x <= B.x0 || g.x >= B.x1) g.hd = Math.PI - g.hd;
            if (g.y <= B.y0 || g.y >= B.y1) g.hd = -g.hd;
          }
          g.x = clamp(g.x, B.x0, B.x1); g.y = clamp(g.y, B.y0, B.y1);
          keepOffStores(g, sim.stores);
          if (!g.cw && g.pk !== sim.steps) rim(g, B, dt);
        } else if (g.st === ST.POUR) {
          g.pt += dt;
          if (g.pt >= 0) {
            const k = Math.min(1, g.pt / cfg.pourTime), e = 1 - (1 - k) * (1 - k);
            g.x = g.ax + (g.bx - g.ax) * e; g.y = g.ay + (g.by - g.ay) * e; g.rot = g.arot + (g.brot - g.arot) * e;
            if (k >= 1) { g.st = ST.GONE; g.x = g.bx; g.y = g.by; g.rot = g.brot; emit('land', { id: g.id, grain: g.type, slot: g.slot }); }
          }
        }
        if (!g.cw && g.warn > 0) g.warn = Math.max(0, g.warn - 4 * dt);
        g.cw = false;
      }
    }

    // Loose grains are solid against each other. A grain the sticks are shoving, one walking into them, or a wrong
    // one creeping toward them does not give way; a walker parts the crowd sideways instead of pushing it ahead into
    // the mouth. A sliding grain hands its speed on like a pool ball and can set a resting one sliding.
    const CELL = 40, nrm = { nx: 0, ny: 0 };
    let cHead = new Int32Array(0), cNext = new Int32Array(0);
    const solid = (g) => g.st === ST.REST || g.st === ST.SLIDE || g.st === ST.WALK;
    const pinned = (g) => g.st === ST.WALK || g.pk === sim.steps;   // shoved by the sticks, or creeping, this step
    const massOf = (g) => { const T = TYPES[g.type], r = T.size * g.s; return r * r * (T.mass || 1); };
    function sidestep(w, nx, ny) {
      const hx = w.hx || 0, hy = w.hy || 0, f = nx * hx + ny * hy;
      if (f <= 0) return;
      let lx = nx - f * hx, ly = ny - f * hy, l = Math.hypot(lx, ly);
      if (l < 0.25) { const side = (lx * hy - ly * hx) > 0 || (l < 1e-6 && (w.id & 1)) ? -1 : 1; lx = -hy * side; ly = hx * side; l = 1; }
      nrm.nx = lx / l; nrm.ny = ly / l;
    }
    function resolve(a, b) {
      const o = overlap(a, b, nrm);
      if (!o) return;
      let nx = nrm.nx, ny = nrm.ny;
      let pa = pinned(a), pb = pinned(b);
      if (pa && pb) {                       // two grains pressed by the sticks share the push and slide apart along them
        if (a.st === ST.WALK || b.st === ST.WALK) return;
        pa = pb = false;
      }
      if (pa || pb) {                                        // the free one takes the whole step
        const w = pa ? a : b, f = pa ? b : a, sx = pa ? nx : -nx, sy = pa ? ny : -ny;
        nrm.nx = sx; nrm.ny = sy;
        if (w.st === ST.WALK) sidestep(w, sx, sy);
        f.x += nrm.nx * o; f.y += nrm.ny * o; f.aw = true; f.hit = sim.steps;
        if (ELONG[f.type] > 0.05) f.rot = turn(f.rot, Math.atan2(nrm.ny, nrm.nx) + Math.PI / 2, ELONG[f.type] * Math.min(0.3, o / 8));
      } else {
        const ia = 1 / massOf(a), ib = 1 / massOf(b), k = o / (ia + ib);
        a.x -= nx * k * ia; a.y -= ny * k * ia; b.x += nx * k * ib; b.y += ny * k * ib; a.aw = b.aw = true; a.hit = b.hit = sim.steps;
        const side = Math.atan2(ny, nx) + Math.PI / 2;            // a long grain pushed on turns side-on to the push
        if (ELONG[a.type] > 0.05) a.rot = turn(a.rot, side, ELONG[a.type] * Math.min(0.3, (k * ia) / 8));
        if (ELONG[b.type] > 0.05) b.rot = turn(b.rot, side, ELONG[b.type] * Math.min(0.3, (k * ib) / 8));
      }
      if (a.st !== ST.SLIDE && b.st !== ST.SLIDE) return;
      const ia = a.st === ST.WALK ? 0 : 1 / massOf(a), ib = b.st === ST.WALK ? 0 : 1 / massOf(b);
      const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (rv >= 0 || ia + ib === 0) return;
      const j = -(1 + 0.35) * rv / (ia + ib);
      a.vx -= j * ia * nx; a.vy -= j * ia * ny; b.vx += j * ib * nx; b.vy += j * ib * ny;
      const tv = (b.vx - a.vx) * -ny + (b.vy - a.vy) * nx;   // a glancing hit sets them spinning
      if (ia) a.w -= tv * 0.02; if (ib) b.w += tv * 0.02;
      for (const g of [a, b]) {
        if (g.st !== ST.REST) continue;
        if (g.vx * g.vx + g.vy * g.vy > 400) g.st = ST.SLIDE; else { g.vx = 0; g.vy = 0; g.w = 0; }
      }
      if (-rv > S.clackV) S.clackV = -rv;
    }
    function collide() {
      if (!cfg.solid) return;
      const gs = sim.grains, cols = Math.ceil(W / CELL) + 1, rows = Math.ceil((sim.H + 200) / CELL) + 1;
      if (cHead.length < cols * rows) cHead = new Int32Array(cols * rows);
      if (cNext.length < gs.length) cNext = new Int32Array(gs.length + 64);
      for (const g of gs) {
        if (!solid(g)) continue;
        orient(g);
        g.aw = g.st !== ST.REST || g.x !== g.px || g.y !== g.py || g.rot !== g.prot;
      }
      for (let it = 0; it < 2; it++) {
        cHead.fill(-1);
        for (const g of gs) {
          if (!solid(g)) continue;
          const c = clamp(Math.floor(g.y / CELL) + 2, 0, rows - 1) * cols + clamp(Math.floor(g.x / CELL), 0, cols - 1);
          cNext[g.id] = cHead[c]; cHead[c] = g.id;
        }
        for (const a of gs) {
          if (!solid(a)) continue;
          const cx = clamp(Math.floor(a.x / CELL), 0, cols - 1), cy = clamp(Math.floor(a.y / CELL) + 2, 0, rows - 1);
          for (let y = Math.max(0, cy - 1); y <= Math.min(rows - 1, cy + 1); y++) {
            for (let x = Math.max(0, cx - 1); x <= Math.min(cols - 1, cx + 1); x++) {
              for (let j = cHead[y * cols + x]; j >= 0; j = cNext[j]) {
                if (j <= a.id) continue;
                const b = gs[j];
                if (!a.aw && !b.aw) continue;
                if (a.st === ST.WALK && b.st === ST.WALK) continue;
                resolve(a, b);
              }
            }
          }
        }
      }
      const B = bounds();
      for (const g of gs) {
        if (g.st !== ST.REST && g.st !== ST.SLIDE) continue;
        if (g.aw) { g.x = clamp(g.x, B.x0, B.x1); g.y = clamp(g.y, B.y0, B.y1); keepOffStores(g, sim.stores); }
        // a grain pushed by a neighbour this step is checked again next step, until nothing pushes it any more
        if (g.hit !== sim.steps) { g.px = g.x; g.py = g.y; g.prot = g.rot; }
      }
      if (S.clackV > 60 && sim.t - S.clackT > 0.035) { emit('clack', { v: S.clackV }); S.clackT = sim.t; }
      S.clackV = 0;
    }

    function tickClocks(dt) {

    }

        pool(c, 330, 950, 320, [255, 150, 70], 0.55 * P.lamp, 0.55);  // and on the board
        pool(c, 560, 820, 160, [255, 150, 70], 0.3 * P.lamp, 0.8);    // a little on the tea
        pool(c, 690, 430, 330, [255, 150, 70], 0.75 * P.lamp, 1.3);   // and a lamp on the wall to the right, out of sight
      }
      c.globalCompositeOperation = 'multiply';                          // less reaches the ceiling and the chairs nearest us
      const g = (v) => { const x = Math.round(255 - (255 - v) * P.ceil); return 'rgb(' + x + ',' + x + ',' + x + ')'; };
      c.fillStyle = lin(c, 0, 0, 0, FH, [[0, g(38)], [0.09, g(68)], [0.15, g(140)], [0.21, '#ffffff'], [0.79, '#ffffff'], [0.85, g(138)], [1, g(58)]]);
      c.fillRect(0, 0, FW, FH);
      const v = c.createRadialGradient(300, 760, 200, 300, 760, 720); v.addColorStop(0, '#ffffff'); v.addColorStop(1, '#6a6a6a');   // and the edges fall into shadow
      c.fillStyle = v; c.fillRect(0, 0, FW, FH);
      c.globalCompositeOperation = 'source-over';
    }

    // ---- the sky ----
    function paintSky(c, P, s) {
      const R = rnd(11);
      c.fillStyle = lin(c, 0, 250, 0, 545, P.sky); c.fillRect(80, 240, 480, 520);
      c.globalCompositeOperation = 'lighter';
      pool(c, 400, 530, 300, P.glow, P.glowA * 0.55, 0.32);           // the last light along the hills
      pool(c, 470, 520, 160, P.glow, P.glowA * 0.5, 0.35);
      if (P.milky) {                                                    // the milky way, rising out of the hills on the right
        c.save(); c.translate(430, 420); c.rotate(-1.05);
        for (let i = 0; i < 70; i++) {
          const u = (R() - 0.5) * 420, v = (R() - 0.5) * 34 * (1 - Math.abs(u) / 260);
          pool(c, u, v, 14 + R() * 26, [176, 186, 240], 0.07 * P.milky * (0.5 + R()));
        }
        for (let i = 0; i < 1600; i++) {
          const u = (R() - 0.5) * 440, v = (R() + R() + R() - 1.5) * 22;
          c.fillStyle = 'rgba(235,238,255,' + (0.25 + R() * 0.5) * P.milky + ')'; c.fillRect(u, v, 0.55, 0.55);
        }
        c.restore();
      }
      if (P.stars) {
        for (let i = 0; i < 520; i++) {
          const x = 90 + R() * 460, y = 250 + Math.pow(R(), 1.4) * 250, big = R();
          const a = P.stars * (0.25 + R() * 0.75) * (1 - Math.max(0, (y - 420) / 90));
          if (a <= 0) continue;
          c.fillStyle = 'rgba(255,250,236,' + a + ')';
          const r = big > 0.97 ? 1.3 : big > 0.85 ? 0.9 : 0.55;
          c.beginPath(); c.arc(x, y, r, 0, 6.284); c.fill();
          if (big > 0.97) pool(c, x, y, 5, [255, 246, 220], 0.35 * a);
        }
      }
      c.globalCompositeOperation = 'source-over';
    }
    function twinkleStars() {
      const R = rnd(23), out = [];
      for (let i = 0; i < 32; i++) out.push([120 + R() * 400, 262 + Math.pow(R(), 1.3) * 170, R() * 6, 0.5 + R() * 1.2]);
      return out;
    }
    // ---- clouds: long low banks, dark above, lit from below by the light along the hills ----
    function cloudBanks(P, s) {
      const R = rnd(37), banks = [];
      const rows = [[292, 0.45, 90], [312, 0.5, 140], [338, 0.65, 180], [356, 0.7, 120], [380, 0.8, 230], [398, 0.85, 160], [418, 0.9, 280], [436, 0.95, 200], [452, 1, 300], [466, 0.95, 240], [480, 0.9, 260]];
      for (const [y, a, w] of rows) {
        const h = 14 + R() * 14 + (y - 290) * 0.06, lay = canvasFor(s, 0, 0, w + 40, h + 30), c = lay.c, n = 10 + Math.floor(w / 9), pts = [];
        for (let i = 0; i < n; i++) {
          const u = 20 + R() * w, mid = 1 - Math.abs(u - 20 - w / 2) / (w / 2);
          pts.push([u, 15 + h * 0.6 - R() * h * 0.4 * mid, (h * 0.12 + R() * h * 0.26) * (0.35 + 0.75 * mid)]);
        }
        soft(c, s, 3, P.cloud[0], () => { for (const [x, yy, r] of pts) { c.beginPath(); c.ellipse(x, yy, r * (2.4 + R() * 2.2), r * 0.62, (R() - 0.5) * 0.06, 0, 6.284); c.fill(); } });
        c.globalCompositeOperation = 'source-atop';
        c.fillStyle = lin(c, 0, 0, 0, h + 30, [[0.15, rgba([0, 0, 0], 0)], [1, P.cloud[1]]]); c.fillRect(0, 0, w + 40, h + 30);
        const rimA = P.rimA * (0.3 + 0.7 * (y - 290) / 190);
        soft(c, s, 2, rgba(P.rim, rimA), () => { for (const [x, yy, r] of pts) { if (R() < 0.4) continue; c.beginPath(); c.ellipse(x + r * 0.4, yy + r * 0.42, r * 2.4, r * 0.22, 0, 0, 6.284); c.fill(); } });
        soft(c, s, 3, 'rgba(0,0,0,0.18)', () => { for (const [x, yy, r] of pts) { if (R() < 0.6) continue; c.beginPath(); c.ellipse(x, yy - r * 0.3, r, r * 0.5, 0, 0, 6.284); c.fill(); } });
        banks.push({ lay, y: y - 15 - h * 0.6, a, x: R() * 560, sp: 1 + R() * 2 + (y - 290) * 0.012, w: w + 40 });
      }
      return banks;
    }
    function mistBand(P, s) {
      const lay = canvasFor(s, 0, 0, 700, 90), c = lay.c, R = rnd(41);
      for (let i = 0; i < 40; i++) pool(c, R() * 700, 45 + (R() - 0.5) * 50, 30 + R() * 50, P.mist, P.mistA * (0.35 + R() * 0.5), 0.28);
      return lay;
    }

    // ---- the land: far blue range, the big hill, the rolling valley, the lake and its village, the dark trees in front ----
    function ridge(x0, x1, step, f) { const pts = []; for (let x = x0; x <= x1; x += step) pts.push([x, f(x)]); return pts; }
    function fillRidge(c, pts, bottom, fill) { c.beginPath(); c.moveTo(pts[0][0], bottom); for (const [x, y] of pts) c.lineTo(x, y); c.lineTo(pts[pts.length - 1][0], bottom); c.closePath(); c.fillStyle = fill; c.fill(); }
    function edgeLight(c, pts, col, a, w) { c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(x, y + 0.6) : c.moveTo(x, y + 0.6))); c.strokeStyle = rgba(col, a); c.lineWidth = w; c.stroke(); }
    function paintLand(c, P, s) {
      const R = rnd(53), wob = (x, k, a) => a * (Math.sin(x * k) * 0.6 + Math.sin(x * k * 2.3 + 1.7) * 0.3 + Math.sin(x * k * 5.1 + 0.4) * 0.1);
      // the far range on the right
      const far = ridge(300, 560, 3, (x) => 540 - 28 * Math.exp(-Math.pow((x - 420) / 38, 2)) - 22 * Math.exp(-Math.pow((x - 510) / 30, 2)) - 10 * Math.exp(-Math.pow((x - 350) / 30, 2)) + wob(x, 0.09, 3));
      fillRidge(c, far, 640, lin(c, 0, 505, 0, 600, [[0, P.far[0]], [1, P.far[1]]]));
      edgeLight(c, far, P.edge, P.edgeA, 1.1);
      // the big hill on the left
      const hill = ridge(80, 520, 3, (x) => (x < 232 ? 482 + Math.pow((232 - x) / 150, 2) * 46 : 482 + Math.pow((x - 232) / 200, 1.6) * 82) + wob(x, 0.07, 4));
      fillRidge(c, hill, 700, lin(c, 0, 478, 0, 640, [[0, P.hill[0]], [1, P.hill[1]]]));
      c.save(); fillRidge(c, hill, 700, 'rgba(0,0,0,0)'); c.clip();
      for (let i = 0; i < 1100; i++) {                                   // the forest on its flanks
        const x = 80 + R() * 440, top = hill[Math.min(hill.length - 1, Math.round((x - 80) / 3))][1], y = top + 6 + R() * 120;
        c.fillStyle = rgba(R() < 0.7 ? [0, 0, 0] : P.tree, (R() < 0.7 ? 0.1 : 0.07) * (P.dots || 1)); c.beginPath(); c.ellipse(x, y, 1.2 + R() * 1.6, 1 + R() * 1.3, 0, 0, 6.284); c.fill();
      }
      c.fillStyle = lin(c, 80, 0, 520, 0, [[0, 'rgba(0,0,0,0.35)'], [0.45, 'rgba(0,0,0,0.05)'], [1, rgba(P.glow, 0.1)]]); c.fillRect(80, 470, 440, 240);
      for (let i = 0; i < 500; i++) { const x = 240 + R() * 280, top = hill[Math.min(hill.length - 1, Math.round((x - 80) / 3))][1], y = top + 3 + R() * 50; c.fillStyle = rgba(P.edge, 0.05 + R() * 0.06); c.beginPath(); c.ellipse(x, y, 1.2 + R(), 0.9, 0, 0, 6.284); c.fill(); }
      c.fillStyle = lin(c, 0, 480, 0, 640, [[0, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,0.35)']]); c.fillRect(80, 470, 440, 240);
      c.restore();
      edgeLight(c, hill, P.edge, P.edgeA * 0.8, 1);
      // rolling hills down in the valley
      const mid = ridge(80, 560, 3, (x) => 588 + wob(x, 0.03, 12) + wob(x + 40, 0.11, 3));
      fillRidge(c, mid, 720, lin(c, 0, 570, 0, 680, [[0, P.mid[0]], [1, P.mid[1]]]));
      c.save(); fillRidge(c, mid, 720, 'rgba(0,0,0,0)'); c.clip();
      for (let i = 0; i < 1400; i++) { const x = 80 + R() * 480, y = 582 + R() * 120; c.fillStyle = rgba(R() < 0.7 ? [0, 0, 0] : P.tree, 0.12 * (P.dots || 1)); c.beginPath(); c.ellipse(x, y, 1.6 + R() * 2.2, 1.4 + R() * 1.8, 0, 0, 6.284); c.fill(); }
      c.restore();
      edgeLight(c, mid, P.edge, P.edgeA * 0.5, 1);
      // the lake, holding the sky
      c.save(); c.beginPath(); c.moveTo(330, 652); c.bezierCurveTo(380, 640, 470, 641, 560, 646); c.lineTo(560, 668); c.bezierCurveTo(470, 672, 390, 672, 330, 664); c.closePath();
      c.fillStyle = lin(c, 0, 640, 0, 672, [[0, P.lake[0]], [1, P.lake[1]]]); c.fill(); c.clip();
      c.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 26; i++) { c.fillStyle = rgba(P.edge, 0.08 + R() * 0.1); c.fillRect(330 + R() * 230, 644 + R() * 26, 6 + R() * 26, 0.7); }
      c.restore();
      // the village on the far shore: windows lit at dusk and by night, and their light on the water
      if (P.village) {
        c.save(); c.globalCompositeOperation = 'lighter';
        for (let i = 0; i < 120; i++) {
          const cl = R() < 0.6, x = cl ? 380 + R() * 170 : 290 + R() * 265, y = 626 + R() * 18 + (x - 290) * 0.02, a = P.village * (0.5 + R() * 0.5);
          c.fillStyle = rgba([255, 204, 130], a); c.fillRect(x, y, 1.3, 1.3);
          if (R() < 0.6) pool(c, x, y, 5, [255, 170, 90], 0.3 * a);
          if (x > 340 && R() < 0.7) { c.fillStyle = rgba([255, 180, 110], 0.45 * a); c.fillRect(x, 652 + R() * 3, 1, 6 + R() * 10); }
        }
        pool(c, 470, 650, 90, [255, 160, 90], 0.12 * P.village, 0.25);
        c.restore();
      }
      // the dark trees between us and the lake
      const tree = (x, y, h, round) => {
        c.beginPath();
        if (round) { for (let k = 0; k < 5; k++) c.ellipse(x + (R() - 0.5) * h * 0.5, y - h * (0.3 + R() * 0.5), h * (0.22 + R() * 0.14), h * (0.2 + R() * 0.12), 0, 0, 6.284); }
        else { c.moveTo(x, y - h); for (let k = 1; k <= 4; k++) { const yy = y - h + (h * k) / 4, ww = h * 0.13 * k; c.lineTo(x + ww, yy); c.lineTo(x + ww * 0.45, yy - h * 0.05); } for (let k = 4; k >= 1; k--) { const yy = y - h + (h * k) / 4, ww = h * 0.13 * k; c.lineTo(x - ww * 0.45, yy - h * 0.05); c.lineTo(x - ww, yy); } c.lineTo(x, y - h); }
        c.fill();
      };
      c.fillStyle = P.forest;
      for (let i = 0; i < 46; i++) { const x = 90 + R() * 460; tree(x, 700 + R() * 30, 30 + R() * 46, R() < 0.45); }
      c.fillRect(80, 712, 480, 40);
      c.globalCompositeOperation = 'source-atop';
      c.fillStyle = lin(c, 0, 640, 0, 740, [[0, rgba(P.edge, P.edgeA * 0.35)], [0.5, 'rgba(0,0,0,0)']]); c.fillRect(80, 620, 480, 130);
      c.globalCompositeOperation = 'source-over';
    }

    // ---- leaves: drawn along stems, each leaf a pointed oval, in a few greens ----
    const GREENS = [[56, 72, 36], [66, 84, 40], [46, 60, 30], [80, 96, 46], [38, 50, 26], [72, 80, 40]];
    function leafy(c, R, stems, size, tint) {
      for (const st of stems) {
        const [x0, y0, x1, y1, bend, n] = st;
        c.strokeStyle = 'rgba(60,44,28,0.9)'; c.lineWidth = 1.1;
        c.beginPath(); c.moveTo(x0, y0); c.quadraticCurveTo((x0 + x1) / 2 + bend, (y0 + y1) / 2, x1, y1); c.stroke();
        for (let i = 0; i < n * 1.4; i++) {
          const back = i < n * 0.4, node = Math.floor(R() * 9) / 9 + R() * 0.05, k = Math.min(1, node), mx = (x0 + x1) / 2 + bend;
          const sx = (1 - k) * (1 - k) * x0 + 2 * (1 - k) * k * mx + k * k * x1, sy = (1 - k) * (1 - k) * y0 + 2 * (1 - k) * k * ((y0 + y1) / 2) + k * k * y1;
          const spread = size * (back ? 1.9 : 1.3), x = sx + (R() - 0.5) * spread * 2, y = sy + (R() - 0.5) * spread * 2;
          const a = R() * 6.284, l = size * (0.6 + R() * 0.7) * (1.1 - 0.3 * k), g = GREENS[Math.floor(R() * GREENS.length)], dk = back ? 0.55 : 1;
          c.save(); c.translate(x, y); c.rotate(a);
          c.fillStyle = 'rgb(' + Math.round(g[0] * tint[0] * dk) + ',' + Math.round(g[1] * tint[1] * dk) + ',' + Math.round(g[2] * tint[2] * dk) + ')';
          c.beginPath(); c.moveTo(-l * 0.55, 0); c.bezierCurveTo(-l * 0.2, -l * 0.42, l * 0.3, -l * 0.34, l * 0.55, 0); c.bezierCurveTo(l * 0.3, l * 0.34, -l * 0.2, l * 0.42, -l * 0.55, 0); c.fill();
          c.fillStyle = 'rgba(0,0,0,0.18)'; c.beginPath(); c.moveTo(-l * 0.55, 0); c.bezierCurveTo(-l * 0.2, l * 0.42, l * 0.3, l * 0.34, l * 0.55, 0); c.closePath(); c.fill();
          c.strokeStyle = 'rgba(255,255,220,0.18)'; c.lineWidth = 0.5; c.beginPath(); c.moveTo(-l * 0.45, 0); c.lineTo(l * 0.45, 0); c.stroke();
          c.restore();
        }
      }
    }
    // ---- wood: a plank or a log, its grain in long strokes ----
    function wood(c, R, x, y, w, h, base, opt = {}) {
      c.save(); c.beginPath(); c.rect(x, y, w, h); c.clip();
      c.fillStyle = base; c.fillRect(x, y, w, h);
      if (opt.round) { c.fillStyle = lin(c, 0, y, 0, y + h, opt.below ? [[0, 'rgba(0,0,0,0.55)'], [0.45, 'rgba(0,0,0,0.1)'], [0.78, 'rgba(255,224,170,0.22)'], [1, 'rgba(0,0,0,0.35)']] : [[0, 'rgba(0,0,0,0.45)'], [0.3, 'rgba(255,230,190,0.14)'], [0.55, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,0.5)']]); c.fillRect(x, y, w, h); }
      const n = Math.max(3, Math.round(h / 3.2)), vert = opt.vertical;
      for (let i = 0; i < n * 3; i++) {
        c.strokeStyle = R() < 0.5 ? 'rgba(40,22,10,' + (0.12 + R() * 0.2) + ')' : 'rgba(255,220,170,' + (0.05 + R() * 0.08) + ')';
        c.lineWidth = 0.5 + R() * 0.9; c.beginPath();
        if (vert) { const xx = x + R() * w; c.moveTo(xx, y); c.bezierCurveTo(xx + (R() - 0.5) * 3, y + h * 0.3, xx + (R() - 0.5) * 3, y + h * 0.7, xx + (R() - 0.5) * 2, y + h); }
        else { const yy = y + R() * h, x0 = x + R() * w * 0.3 - 10; c.moveTo(x0, yy); c.bezierCurveTo(x0 + w * 0.3, yy + (R() - 0.5) * 3, x0 + w * 0.6, yy + (R() - 0.5) * 3, x0 + w * (0.5 + R() * 0.8), yy + (R() - 0.5) * 2); }
        c.stroke();
      }
      if (opt.knots) for (let i = 0; i < opt.knots; i++) { const kx = x + R() * w, ky = y + h * (0.3 + R() * 0.4); c.strokeStyle = 'rgba(40,22,10,0.35)'; c.lineWidth = 0.8; c.beginPath(); c.ellipse(kx, ky, 4 + R() * 4, 1.4 + R(), 0, 0, 6.284); c.stroke(); }
      c.restore();
    }

    // ---- the porch outside the window: the bushes below the rail, the rail and its posts, the leaves at the right ----
    function paintPorch(c, P) {
      const R = rnd(61);
      leafy(c, R, [[500, 740, 540, 300, 18, 170], [520, 730, 548, 420, -10, 120], [470, 720, 530, 540, 20, 90], [430, 726, 520, 640, 10, 60], [90, 726, 170, 600, -16, 70], [170, 726, 250, 660, 10, 50], [250, 726, 330, 690, -8, 30]], 12, P.leaf);
      c.fillStyle = '#2a3a22'; c.fillRect(0, 756, FW, 90);
      leafy(c, R, [[0, 840, 640, 790, -30, 260], [20, 800, 620, 830, 20, 240]], 17, P.leaf.map((v) => v * 0.7));
      wood(c, R, 0, 724, FW, 34, '#b4763f', { round: 1, knots: 3 });                 // the rail
      for (const [x, w] of [[248, 28], [330, 36]]) { wood(c, R, x, 756, w, 90, '#94603a', { vertical: 1 }); c.fillStyle = 'rgba(0,0,0,0.3)'; c.fillRect(x + w - 5, 756, 5, 90); }
      wood(c, R, 332, 716, 34, 16, '#b07a4a', {});                                       // the post's cap above the rail
    }
    // ---- the voile: sheer cream fabric in soft folds; the left falls straight, the right is tied back ----
    function paintCurtain(c, side, s) {
      const R = rnd(side < 0 ? 71 : 73);
      const shape = side < 0
        ? (v) => [0, 102 - v * 8]                                       // its left and right edges, a share v of the way down
        : (v) => { const tie = 0.55, k = v < tie ? v / tie : (v - tie) / (1 - tie); return v < tie ? [535 + 40 * k * k, 625 - 10 * k] : [575 - 28 * k, 615 + 8 * k]; };
      const top = 246, bot = side < 0 ? 742 : 828, N = 60, pts = [];
      for (let i = 0; i <= N; i++) { const v = i / N; pts.push([top + (bot - top) * v, ...shape(v)]); }
      const outline = () => { c.beginPath(); pts.forEach(([y, a], i) => (i ? c.lineTo(a, y) : c.moveTo(a, y))); for (let i = N; i >= 0; i--) c.lineTo(pts[i][2], pts[i][0]); c.closePath(); };
      c.save(); outline(); c.fillStyle = 'rgba(236,216,184,0.82)'; c.fill(); c.clip();
      // the folds: soft bands of light and shade that follow the fall of the cloth
      const folds = 7, band = (p, w, col, blur) => soft(c, s, blur, col, () => {
        c.lineWidth = w; c.lineCap = 'butt'; c.strokeStyle = col; c.beginPath();
        pts.forEach(([y, a, b], i) => { const x = a + (b - a) * (p + 0.03 * Math.sin(y * 0.02 + p * 9)); if (i) c.lineTo(x, y); else c.moveTo(x, y); }); c.stroke();
      });
      for (let f = 0; f < folds; f++) {
        const p = (f + 0.5) / folds;
        band(p - 0.05, 8, 'rgba(110,66,36,0.42)', 4);
        band(p + 0.045, 5, 'rgba(255,246,226,0.4)', 3);
      }
      c.fillStyle = lin(c, 0, top, 0, top + 34, [[0, 'rgba(80,46,24,0.5)'], [1, 'rgba(80,46,24,0)']]); c.fillRect(0, top, FW, 34);   // gathered at the rod
      if (side > 0) { c.fillStyle = 'rgba(90,56,30,0.3)'; c.fillRect(560, 538, 70, 34); }
      for (let i = 0; i < 90; i++) { const y = top + R() * (bot - top), [a, b] = shape((y - top) / (bot - top)); c.fillStyle = 'rgba(170,120,80,0.16)'; c.fillRect(a + R() * (b - a), y, 1, 1); }
      c.restore();
      if (side > 0) {                                                   // the tie: a band of the same cloth
        c.fillStyle = '#eadbbd'; c.beginPath(); c.moveTo(570, 548); c.quadraticCurveTo(596, 543, 620, 549); c.lineTo(620, 563); c.quadraticCurveTo(596, 558, 570, 563); c.closePath(); c.fill();
        c.strokeStyle = 'rgba(110,70,40,0.4)'; c.lineWidth = 1; c.stroke();
      }
    }
    // ---- the room in front: the ceiling and the beams, the vine by the left curtain, the post, the table and all on it, the chairs ----
    function paintFront(c, P, s) {
      const R = rnd(83);
      // the vine climbing in front of the left curtain
      leafy(c, R, [[40, 772, 96, 340, 26, 150], [0, 760, 60, 440, 20, 120], [10, 770, 170, 630, -30, 130], [60, 772, 210, 700, -10, 80], [0, 660, 120, 580, -20, 100], [90, 370, 150, 310, 10, 30], [150, 772, 250, 730, -6, 50]], 12, P.leaf);
