<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<title>Zen Grain</title>
<meta name="theme-color" content="#0f1215">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Klee+One:wght@400;600&family=Yuji+Syuku&family=Cabin+Sketch:wght@700&family=Patrick+Hand&display=swap">
<style>
  /* Chalk on slate. Whatever is written on the board (score, multiplier, tallies, notes) is chalk in a hand;
     the menus are a slate slab across the bottom, inside thumb reach, with a chalk rule along its top edge.
     Small print stays in a plain face. The one loud thing is on the board itself: the chopstick tips heat up
     with the multiplier and a wrong grain quenches them. */
  :root.chalkfont { --hand: "Patrick Hand", "Segoe Print", "Bradley Hand", cursive; --sketch: "Cabin Sketch", "Patrick Hand", cursive; --sketch-w: 700; --sketch-ls: 0; --btn-fs: var(--fs-24); }
  /* the pen hand runs wider than the chalk one: buttons and the header line a size down, the brush set a little tighter */
  :root { --sketch-ls: -0.03em; --btn-fs: var(--fs-20); }
  :root {
    --slate: #0f1215;
    --slab: #171b20;
    --chalk: #ece8de;
    --chalk-2: rgba(236, 232, 222, 0.62);
    --chalk-3: rgba(236, 232, 222, 0.3);
    --lentil: #ef8a40;
    --mung: #8fb85a;
    --chickpea: #dcb47c;
    --sesame: #efe4cb;
    --kidney: #b8463e;
    --ember: #f6c453;
    --chalk-red: #ff7a6b;
    /* a Japanese pen hand for everything written on the board, a brush for names and big numbers; both carry every
       Polish letter. ?font=chalk brings back the chalk faces of the first boards to compare. */
    --hand: "Klee One", "Segoe Print", "Bradley Hand", cursive;
    --sketch: "Yuji Syuku", "Klee One", serif;
    --sketch-w: 400;
    --print: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --fs-13: 13px; --fs-15: 15px; --fs-17: 17px; --fs-20: 20px; --fs-24: 24px; --fs-28: 28px; --fs-34: 34px; --fs-44: 44px; --fs-56: 56px;
    --halo: 0 0 3px rgba(15, 18, 21, 0.95), 0 0 14px rgba(15, 18, 21, 0.9);
    color-scheme: dark;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: #0d0f12; color: var(--chalk); font: 400 var(--fs-15)/1.45 var(--print);
    overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px dashed var(--ember); outline-offset: 3px; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #safe { position: fixed; inset: 0; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  .haptic { position: fixed; left: -100px; top: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  /* chalk: a speckled mask made at start-up (see chalkMask) roughens anything written on the board */
  .chalk { -webkit-mask-image: var(--chalk-mask); mask-image: var(--chalk-mask); -webkit-mask-size: 180px; mask-size: 180px; }

  /* ---------- HUD, written straight on the slate ---------- */
  #hud {
    position: fixed; left: 50%; top: 0; z-index: 2; pointer-events: none; box-sizing: border-box;
    width: min(100%, var(--board-w, 100%)); transform: translateX(-50%);
    padding-top: calc(env(safe-area-inset-top, 0px) + 8px);
    padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
    display: grid; grid-template-columns: 48px 1fr 96px; align-items: start; gap: 6px;
    font-family: var(--hand); line-height: 1;
  }
  #hud > * { pointer-events: auto; }
  .iconbtn { width: 44px; height: 44px; border: 0; background: none; display: grid; place-items: center; padding: 0; }
  .iconbtn svg { width: 22px; height: 22px; fill: none; stroke: var(--chalk-2); stroke-width: 2.6; stroke-linecap: round; }
  /* the corners of the HUD: back and again on the left, pause over the score on the right */
  #hud .side { display: flex; flex-direction: column; align-items: flex-start; }
  #hud .side.end { align-items: flex-end; }
  #hud .side .iconbtn { width: 48px; height: 44px; }
  #hud .iconbtn svg { width: 24px; height: 24px; stroke: var(--chalk); stroke-linejoin: round; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .7)); }
  #hud .iconbtn.big { width: 52px; height: 52px; margin: -4px -6px 0 0; }
  #hud .iconbtn.big svg { width: 30px; height: 30px; stroke-width: 3; }
  #hud .iconbtn:active svg { transform: scale(0.9); }
  #hud .iconbtn.ask svg { stroke: var(--ember); }
  .mid { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; padding-top: 4px; }
  #chip { display: flex; align-items: center; gap: 7px; white-space: nowrap; max-width: 100%; font-size: var(--fs-24); }
  #chip.long { font-size: var(--fs-20); gap: 5px; }
  #chip.swap { animation: swap .24s cubic-bezier(.2, .8, .2, 1); }
  @keyframes swap { from { transform: translateY(-6px) rotate(-3deg); opacity: 0; } }
  #chip .ico { width: 22px; height: 22px; display: block; flex: none; }
  #chip .left { color: var(--chalk-2); font-size: var(--fs-20); }
  #streak { display: flex; align-items: center; gap: 10px; height: 34px; }
  #streak b { font-weight: 400; font-size: var(--fs-34); min-width: 2.4ch; text-align: center; transition: color .2s ease; }
  #streak.hot b { color: var(--lentil); }
  #streak.max b { color: var(--ember); }
  /* full rows in a row, as tally marks in fives on their own line, so they never read as digits */
  #tally { display: flex; gap: 7px; height: 16px; margin-top: 3px; }
  #tally svg { fill: none; stroke: var(--chalk-2); stroke-width: 2.4; stroke-linecap: round; }
  #streak.up b { animation: up .4s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes up { 35% { transform: scale(1.35) rotate(-4deg); } }
  #streak.lost { animation: lost .42s ease; }
  @keyframes lost { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  #streak.lost b { animation: lostc .9s ease; }
  @keyframes lostc { 0%, 55% { color: var(--chalk-red); } }
  /* pace: a chalk line that wears away from both ends; when it is gone the next full row counts as slow */
  #fuse { display: block; width: 132px; height: 4px; border-radius: 2px; background: var(--chalk-2); transform: scaleX(0); transition: background .25s ease; }
  #fuse[data-pace="Lightning"] { background: var(--ember); }
  #fuse[data-pace="Quick"] { background: var(--lentil); }
  #fuse[data-pace="Slow"] { background: var(--chalk-red); }
  #score { justify-self: end; text-align: right; margin-top: -2px; }
  #score b { display: block; font-weight: 400; font-size: var(--fs-34); line-height: 1; }
  #score span { color: var(--chalk-2); font-size: var(--fs-20); }
  #score span.low { color: var(--ember); }
  #score span.over { color: var(--chalk-red); }
  #score.down b { color: var(--chalk-red); }
  #tally .nw { stroke: var(--chalk); stroke-dasharray: 30; animation: draw .3s ease-out backwards; }
  @keyframes draw { from { stroke-dashoffset: 30; } }

  /* notes chalked onto the board: a dark halo instead of a box keeps them legible over grains */
  .note { position: fixed; left: 50%; z-index: 3; pointer-events: none; transform: translateX(-50%); text-align: center;
    font-family: var(--hand); line-height: 1.2; text-shadow: var(--halo); padding: 16px 30px; box-sizing: border-box;
    background: radial-gradient(closest-side, rgba(15, 18, 21, 0.9), rgba(15, 18, 21, 0.72) 62%, rgba(15, 18, 21, 0)); }
  #banner { top: calc(env(safe-area-inset-top, 0px) + 112px); opacity: 0; transform: translate(-50%, -6px) rotate(-1.5deg);
    transition: opacity .2s ease, transform .2s ease; width: max-content; max-width: min(88vw, 380px); }
  #banner.show { opacity: 1; transform: translate(-50%, 0) rotate(-1.5deg); }
  #banner b { display: block; font-weight: 400; font-size: var(--fs-34); color: var(--ember); }
  #banner span { font-size: var(--fs-20); }
  #hint { top: calc(env(safe-area-inset-top, 0px) + 112px); width: max-content; max-width: min(84vw, 360px); font-size: var(--fs-24); transition: opacity .2s ease; }
  #hint.off { opacity: 0; }
  #toast { top: calc(env(safe-area-inset-top, 0px) + 70px); z-index: 6; font-size: var(--fs-20); opacity: 0; transition: opacity .2s ease; width: max-content; max-width: min(88vw, 380px); }
  #toast.show { opacity: 1; }

  /* ---------- menus: a slate slab across the bottom ---------- */
  .screen {
    position: fixed; inset: 0; z-index: 4; display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
    background: linear-gradient(to bottom, rgba(10, 12, 15, 0) 30%, rgba(10, 12, 15, 0.8));
  }
  .screen.dim { background: rgba(10, 12, 15, 0.62); }
  .slab {
    position: relative; width: min(100%, var(--board-w, 100%)); box-sizing: border-box; background: var(--slab);
    padding: 26px max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 18px) max(20px, env(safe-area-inset-left, 0px));
    display: flex; flex-direction: column; gap: 14px; border-top: 1px solid rgba(255, 255, 255, 0.07);
    animation: rise .26s cubic-bezier(.2, .8, .2, 1);
    max-height: calc(100% - env(safe-area-inset-top, 0px) - 24px); overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .slab::before { content: ""; position: absolute; left: 18px; right: 18px; top: 11px; height: 3px; border-radius: 2px; background: var(--chalk-3);
    -webkit-mask-image: var(--chalk-mask); mask-image: var(--chalk-mask); -webkit-mask-size: 180px; mask-size: 180px; }
  @keyframes rise { from { transform: translateY(40px); opacity: 0; } }
  h1, h2 { margin: 0; font-weight: 400; text-wrap: balance; }
  h1 { font: var(--sketch-w) var(--fs-56)/0.95 var(--sketch); letter-spacing: var(--sketch-ls); }
  h2 { font: 400 var(--fs-34)/1.05 var(--hand); }
  .kicker { margin: 0 0 -10px; font: 400 var(--fs-20)/1.2 var(--hand); color: var(--chalk-2); }
  .lede { margin: 0; font: 400 var(--fs-24)/1.25 var(--hand); color: var(--chalk-2); }
  .primary {
    height: 58px; border: 0; border-radius: 11px 8px 12px 7px; background: var(--chalk); color: var(--slate); flex: none;
    font: 400 var(--fs-24)/1 var(--hand); display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 18px;
  }
  .primary:active { transform: scale(0.985) rotate(-0.3deg); }
  .ghost {
    min-height: 52px; border-radius: 9px 7px 10px 8px; border: 2px solid var(--chalk-2); background: rgba(236, 232, 222, 0.07); padding: 0 16px;
    font: 400 var(--btn-fs)/1.1 var(--hand); color: var(--chalk); display: flex; align-items: center; justify-content: center; gap: 8px; flex: none;
  }
  .ghost:active { background: rgba(236, 232, 222, 0.14); }
  .ghost svg { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .ghost.back { margin-top: 6px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  /* a volume: its name, then a chalk line with a round stone to slide */
  .vol { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); align-items: center; gap: 14px; min-height: 48px; padding: 0 4px;
    font: 400 var(--fs-20)/1.1 var(--hand); }
  .vol input { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; margin: 0; background: none; }
  .vol input::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--chalk) var(--v, 100%), var(--chalk-3) var(--v, 100%)); }
  .vol input::-moz-range-track { height: 4px; border-radius: 2px; background: var(--chalk-3); }
  .vol input::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--chalk); }
  .vol input::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -11px; border-radius: 50%; background: var(--chalk); box-shadow: 0 2px 6px rgba(0, 0, 0, .5); }
  .vol input::-moz-range-thumb { width: 26px; height: 26px; border: 0; border-radius: 50%; background: var(--chalk); box-shadow: 0 2px 6px rgba(0, 0, 0, .5); }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .sub { margin: 0; color: var(--chalk-2); font: 400 var(--fs-15)/1.4 var(--print); }

  /* the lobby: your stars, how far to the next board, the boards themselves */
  .purse { margin: 0; display: flex; align-items: center; gap: 10px; }
  .purse svg { width: 30px; height: 30px; fill: var(--ember); stroke: var(--ember); stroke-width: 1.2; stroke-linejoin: round; transform: rotate(-6deg); flex: none; }
  .purse b { font: var(--sketch-w) var(--fs-44)/1 var(--sketch); letter-spacing: var(--sketch-ls); }
  .purse span { font: 400 var(--fs-17)/1.2 var(--hand); color: var(--chalk-2); white-space: nowrap; }
  :root.chalkfont .purse span { font-size: var(--fs-20); }
  /* the room: the painting fills the screen; a tap anywhere sits you down at the table */
  .roomview { position: fixed; inset: 0; z-index: 3; }
  .enter { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; padding: 0; background: transparent; cursor: pointer; }
  #enterHint { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 34px); width: max-content; max-width: 90vw; font-size: var(--fs-20); transition: opacity .8s ease; }
  #enterHint.off { opacity: 0; }
  /* the title, in the dark of the ceiling above the window, lit by the lantern */
  .roomtitle { position: absolute; left: 0; right: 0; top: calc((var(--ceil, 140px) + env(safe-area-inset-top, 0px)) / 2); margin: 0;
    text-align: center; pointer-events: none; font: 400 var(--fs-56)/1 var(--sketch); letter-spacing: 0.02em;
    color: #f8e8c8; text-shadow: 0 0 16px rgba(255, 176, 92, 0.55), 0 0 44px rgba(255, 150, 70, 0.3), 0 2px 3px rgba(0, 0, 0, 0.6);
    opacity: 0; transform: translateY(calc(-50% + 8px)); transition: opacity .45s ease, transform .45s ease; }
  .roomtitle.on { opacity: 1; transform: translateY(-50%); transition-duration: 1.6s; }
  @media (max-width: 359px) { .roomtitle { font-size: var(--fs-44); } }
  /* choosing a board: each board fills the screen as it does in play, its levels laid on it as paper cards; swipe for
     the next board. The stars and the way back stay put at the top, the chopsticks at the bottom. */
  .tableview { position: fixed; inset: 0; z-index: 3; opacity: 0; transition: opacity .4s ease; }
  .tableview.show { opacity: 1; }
  .tbar { position: absolute; z-index: 2; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 6px); transform: translateX(-50%);
    width: min(100%, 520px); display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: 0 8px; box-sizing: border-box; }
  .tbar .purse { justify-content: center; text-shadow: var(--halo); }
  .tbar .purse b { font-size: var(--fs-34); }
  .tbar .iconbtn svg { stroke: var(--chalk); filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
  .pages { position: absolute; inset: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory;
    scrollbar-width: none; overscroll-behavior-x: contain; }
  .pages::-webkit-scrollbar { display: none; }
  .bpage { flex: none; position: relative; width: 100%; height: 100%; overflow: hidden; scroll-snap-align: center; scroll-snap-stop: always;
    color: var(--chalk); font-family: var(--hand); }
  .bpage > canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .bpage.locked > canvas { filter: brightness(.5) saturate(.6); }
  .bhead { position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 66px); margin: 0; text-align: center; text-shadow: var(--halo); }
  .bhead b { display: block; font: var(--sketch-w) var(--fs-44)/1 var(--sketch); letter-spacing: var(--sketch-ls); }
  /* the chalk sketch face has no Polish letters (Ł, Ż…): with it, Polish board names are written in the hand, so they match */
  :root.chalkfont:lang(pl) .bhead b { font: 400 var(--fs-44)/1 var(--hand); }
  .bhead span { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: var(--fs-20); color: var(--chalk-2); }
  .bhead svg { width: 17px; height: 17px; fill: var(--ember); stroke: var(--ember); }
  .cards { position: absolute; left: 50%; top: var(--cards-top, 170px); transform: translateX(-50%); width: calc(var(--card-w, 76px) * 3 + var(--card-gap, 20px) * 2);
    display: flex; flex-wrap: wrap; justify-content: center; gap: var(--card-gap, 20px); }
  .dots { position: absolute; z-index: 2; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 74px); display: flex; justify-content: center; gap: 10px; pointer-events: none; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--chalk-3); transition: background .25s ease; }
  .dots i.on { background: var(--chalk); }
  .rest { position: absolute; z-index: 2; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); padding: 4px 10px; border: 0; background: none;
    transform: translateX(-50%) rotate(-3deg); }
  .rest img { display: block; width: 168px; height: 28px; }
  /* the level cards: wooden tags like the one on the wind chime, cut corners, a hole and its loop of cord,
     the number brushed on in ink, laid on the board a little crooked; the next one sways as if in the breeze */
  .lcard { position: relative; flex: none; width: var(--card-w, 76px); height: var(--card-h, 98px); border: 0; padding: 18px 4px 6px; box-sizing: border-box;
    background: none; color: #2b1b0e; transform: rotate(var(--tilt, 0deg)); transform-origin: 50% 12px;
    filter: drop-shadow(0 6px 7px rgba(20, 10, 3, .55));
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: var(--hand); }
  .lcard::before { content: ""; position: absolute; inset: 0; z-index: -1;
    clip-path: polygon(13px 0, calc(100% - 13px) 0, 100% 13px, 100% 100%, 0 100%, 0 13px);
    background:
      radial-gradient(circle at 50% 12px, rgba(22, 12, 5, .9) 0 3px, rgba(110, 70, 34, .55) 3.4px 4.8px, transparent 5.2px),
      repeating-linear-gradient(91deg, transparent 0 6px, rgba(110, 66, 26, .09) 6px 7px, transparent 7px 13px),
      linear-gradient(97deg, transparent 0 30%, rgba(255, 238, 200, .16) 46%, transparent 62%),
      linear-gradient(172deg, #e6c28b, #cfa265 58%, #bb8c51); }
  .lcard::after { content: ""; position: absolute; left: calc(50% - 6px); top: -13px; width: 12px; height: 22px; box-sizing: border-box;
    border: 1.6px solid #8d6c49; border-bottom-color: transparent; border-radius: 50% 50% 45% 45%; transform: rotate(-8deg); }
  .lcard b { font: 400 var(--fs-28)/1 var(--sketch); }
  .lcard .stars { display: flex; gap: 1px; }
  .lcard .stars svg { width: 11px; height: 11px; stroke: rgba(70, 40, 15, .45); fill: none; }
  .lcard .stars svg.on { fill: #2b1b0e; stroke: #2b1b0e; }
  .lcard small { font-size: var(--fs-13); color: rgba(60, 34, 12, .7); }
  .lcard.next { animation: sway 3.4s ease-in-out infinite alternate; filter: drop-shadow(0 12px 10px rgba(20, 10, 3, .6)); }
  .lcard.next::before { background:
      radial-gradient(circle at 50% 12px, rgba(22, 12, 5, .9) 0 3px, rgba(110, 70, 34, .55) 3.4px 4.8px, transparent 5.2px),
      repeating-linear-gradient(91deg, transparent 0 6px, rgba(110, 66, 26, .09) 6px 7px, transparent 7px 13px),
      linear-gradient(97deg, transparent 0 30%, rgba(255, 238, 200, .2) 46%, transparent 62%),
      linear-gradient(172deg, #f0cf98, #d9ad70 58%, #c4955a); }
  @keyframes sway { from { transform: rotate(calc(var(--tilt, 0deg) - 1.6deg)) translateY(-6px); } to { transform: rotate(calc(var(--tilt, 0deg) + 1.6deg)) translateY(-6px); } }
  .lcard.locked { color: #4a3826; }
  .lcard.locked::before { background:
      radial-gradient(circle at 50% 12px, rgba(22, 12, 5, .9) 0 3px, rgba(80, 52, 28, .55) 3.4px 4.8px, transparent 5.2px),
      repeating-linear-gradient(91deg, transparent 0 6px, rgba(60, 36, 16, .12) 6px 7px, transparent 7px 13px),
      linear-gradient(172deg, #9c8462, #86694a 58%, #6f5539); }
  .lcard.locked svg rect, .lcard.locked svg path { fill: #4a3826; stroke: #4a3826; }
  .lcard.locked svg path { fill: none; }
  /* a board opening: the page brightens, "… is open" is chalked across it, then its tags are laid down one by one */
  .bpage > canvas { transition: filter .9s ease; }
  .bpage.sealed > canvas { filter: brightness(.5) saturate(.6); }
  .bpage .bopen { position: absolute; left: 0; right: 0; top: 40%; margin: 0; text-align: center; z-index: 2; pointer-events: none;
    font: 400 var(--fs-44)/1.1 var(--hand); color: var(--chalk); text-shadow: var(--halo); transform: rotate(-3deg);
    clip-path: inset(0 100% 0 0); transition: clip-path 1.1s cubic-bezier(.5, 0, .3, 1), opacity .6s ease; }
  .bpage.write .bopen { clip-path: inset(0 0 0 0); }
  .bpage.write.laid .bopen { opacity: 0; transition-delay: 0s, .2s; }
  .bpage.veiled .lcard { opacity: 0; transform: rotate(var(--tilt, 0deg)) translateY(-16px); animation: none; }
  .bpage.laid .lcard { transition: opacity .28s ease var(--delay, 0s), transform .32s cubic-bezier(.2, .9, .3, 1.2) var(--delay, 0s); }

  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .list li + li { border-top: 1px dashed rgba(236, 232, 222, 0.1); }
  .stars { display: flex; gap: 1px; }
  .stars svg { width: 17px; height: 17px; fill: none; stroke: var(--chalk-3); stroke-width: 1.7; stroke-linejoin: round; }
  .stars svg.on { fill: var(--ember); stroke: var(--ember); }
  .stars.big { gap: 6px; justify-content: center; margin: 2px 0 -2px; }
  .stars.big svg { width: 46px; height: 46px; stroke-width: 1.4; }
  .stars.big svg.stamp { animation: stamp .3s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes stamp { from { transform: scale(1.9) rotate(-14deg); opacity: 0; } }

  /* the end of a level: a tally chalked up line by line, then the score counts up and stamps the stars */
  .tally { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; font: 400 var(--fs-20)/1.3 var(--hand); }
  .tally li { display: flex; justify-content: space-between; gap: 12px; animation: write .22s ease backwards; }
  .tally li span { color: var(--chalk-2); }
  .tally li.minus b { color: var(--chalk-red); }
  .tally li b { font-weight: 400; }
  @keyframes write { from { opacity: 0; transform: translateX(-8px); } }
  .total { margin: 0; display: flex; align-items: center; gap: 12px; border-top: 2px solid var(--chalk-3); padding-top: 10px; }
  .total span { font: 400 var(--fs-20)/1 var(--hand); color: var(--chalk-2); }
  .total b { margin-left: auto; font: var(--sketch-w) var(--fs-44)/1 var(--sketch); letter-spacing: var(--sketch-ls); }
  .total em { font: 400 var(--fs-17)/1 var(--hand); color: var(--ember); border: 2px solid var(--ember); border-radius: 50% / 46%;
    padding: 5px 10px 4px; transform: rotate(-6deg); animation: stamp .3s cubic-bezier(.3, 1.6, .5, 1) backwards; }
  .prize { margin: 0; font: 400 var(--fs-20)/1.3 var(--hand); color: var(--chalk); }
  .prize b { font-weight: 400; color: var(--ember); }

  .pairrow {
    width: 100%; display: grid; grid-template-columns: 92px 1fr auto; gap: 12px; align-items: center; min-height: 60px;
    background: transparent; border: 0; padding: 6px 4px; text-align: left;
  }
  .pairrow:active { background: rgba(236, 232, 222, 0.05); }
  .pairrow .pv { display: flex; flex-direction: column; gap: 5px; }
  .pairrow .pv i { display: block; height: 8px; clip-path: polygon(0 32%, 100% 0, 100% 100%, 0 68%); border-radius: 2px; }
  .pairrow .nm { min-width: 0; font: 400 var(--fs-20)/1.15 var(--hand); }
  .pairrow .nm small { display: block; color: var(--chalk-2); font: 400 var(--fs-13)/1.3 var(--print); margin-top: 2px; }
  .pairrow .st { font: 400 var(--fs-17)/1 var(--hand); color: var(--chalk-2); white-space: nowrap; }
  .pairrow.on .st { color: var(--ember); }
  .pairrow.locked .pv, .pairrow.locked .nm b { opacity: 0.4; }

  #tuneList { display: flex; flex-direction: column; gap: 6px; }
  .trow { display: grid; grid-template-columns: 1fr 64px; gap: 4px 10px; align-items: center; }
  .trow label { font-size: var(--fs-13); color: var(--chalk-2); }
  .trow output { text-align: right; font-variant-numeric: tabular-nums; font-size: var(--fs-13); }
  .trow input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--lentil); }
  .check { display: flex; align-items: center; gap: 10px; font-size: var(--fs-15); min-height: 40px; }
  .check input { width: 20px; height: 20px; accent-color: var(--lentil); }
  #tuneJson { width: 100%; box-sizing: border-box; background: #0d0f12; color: var(--chalk); border: 1px solid var(--chalk-3); border-radius: 10px; font: 12px ui-monospace, Menlo, monospace; }

  @media (prefers-reduced-motion: reduce) {
    .slab, #chip.swap, .stars.big svg.stamp, #streak.up b, #streak.lost, #streak.lost b, .tally li, .total em, #tally .nw, .lcard.next { animation: none; }
    .bpage .bopen, .bpage.laid .lcard, .bpage > canvas { transition: none; }
    #hint, #toast, #banner, #fuse, #streak b, .tableview, #enterHint, .dots i, .roomtitle { transition: none; }
    .roomtitle, .roomtitle.on { transform: translateY(-50%); }
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Game board"></canvas>
<div id="safe"></div>

<div id="hud" hidden>

</div>

<section id="title" class="roomview" hidden>

</section>

<section id="table" class="tableview" hidden>
  <header class="tbar">

    <p class="purse chalk"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.4l2.8 6.3 6.8.6-5.2 4.5 1.6 6.7-6-3.6-6 3.6 1.6-6.7-5.1-4.5 6.8-.6z"/></svg><b id="tStars">0</b><span id="tNext"></span></p>
    <span></span>

  <div class="dots" id="boardDots" aria-hidden="true"></div>

</section>

<section id="sticks" class="screen dim" hidden>

      <div class="vol"><label for="sfxVol">Game sounds</label><input type="range" id="sfxVol" min="0" max="100" step="5"></div>
      <div class="vol"><label for="ambVol">Ambience</label><input type="range" id="ambVol" min="0" max="100" step="5"></div>
      <div class="pair">
        <button id="langBtn" class="ghost"><svg viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="8.2"/><path d="M2.8 11h16.4M11 2.8c-2.6 2.6-2.6 13.8 0 16.4M11 2.8c2.6 2.6 2.6 13.8 0 16.4"/></svg><span>English</span></button>

<section id="done" class="screen" hidden>

    <button id="nextBtn" class="primary">Next level</button>
    <div class="pair">
      <button id="retryBtn" class="ghost"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M18.6 13.4a7.8 7.8 0 1 1-1.9-8L20 8.6"/><path d="M20.3 3.6v5.2h-5.1"/></svg>Retry</button>
      <button id="doneLevelsBtn" class="ghost back"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M13.6 4.4c-2.5 2.3-4.4 4.3-6.3 6.5 1.9 2.1 3.9 4.1 6.4 6.5"/></svg>Back</button>
    </div>
  </div>
</section>

<section id="tune" class="screen dim" hidden>
  <div class="slab">

    <button id="tuneDoneBtn" class="primary">Done</button>
  </div>
</section>

<div id="toast" class="note chalk" role="status"></div>

<script>
// ===== GRAIN-SIM BEGIN =====
// Pure, seeded simulation: no DOM, no Math.random, no Date. Fixed step. The board is W units wide, seen from
// above; nothing falls. Grains of the row's kind walk in single file into the open sticks, the sticks' sides
// shove other grains aside, and every finished row is poured onto its kind's pile in a bottom corner.
const GrainSim = (() => {
  'use strict';

  const W = 600;
  // JAR: still in the jar, not on the board yet. LOST: slid off a tilted tray.
  const ST = { REST: 0, WALK: 1, ROW: 2, SLIDE: 3, POUR: 4, GONE: 5, JAR: 6, LOST: 7 };

  const DEFAULTS = {
    stepHz: 120,
    fingerOffset: 180,   // the tips sit this far above the finger, so the thumb never hides them
    followOmega: 28,     // tip spring, critically damped (1/s)
    zoneR: 160,          // reach: grains of the row's kind inside it walk in
    creepR: 100,         // grains of another kind this close to the tips creep in
    fieldAhead: 0.45,    // both circles sit this share of their radius in front of the tips, away from the thumb
    fieldCone: 180,      // half-angle in degrees the sticks pull from; 180 = all around
    callInterval: 0.07,  // a new grain joins the file at most this often (s)
    maxTrail: 10,        // grains walking at once
    walkSpeed: 520,      // lead grain speed (units/s)
    catchUp: 1.7,        // followers move faster to close gaps in the file
    creepSpeed: 55,      // how fast a wrong grain creeps toward the tips (units/s)
    loseDist: 2.4,       // a walking grain stops when the tips are this many reaches away
    channelLen: 330,     // how much row fits between the sticks
    enterTime: 0.16,
    enterDist: 900,
    closeTime: 0.08,
    carryTime: 0.34,     // the closed sticks carry the row to its pile
    pourTime: 0.2,
    pourStagger: 0.016,
    retractSpeed: 6000,
    breakScatter: 120,   // how far a broken row scatters (units)
    friction: 7,         // sliding grains slow down (1/s)
    flick: 0.55,         // share of the sticks' sideways speed a shoved grain keeps
    drift: 0,            // loose grains wander this fast (units/s); 0 = they stay put
    solid: 1,            // 1 = loose grains are solid against each other; 0 = they pass through each other
    paceBase: 1.4, pacePerGrain: 0.12,   // seconds a quick row of n grains takes: paceBase + pacePerGrain × n
    paceK: 1,            // scales that pace; above 1 is more forgiving
    parBase: 8, parPerGrain: 0.5, parPerRow: 1.4,   // the level clock
    stickSpread: 0.04,   // the channel widens toward the hand
    leanK: 0.45,         // how far the hand follows the tips sideways
    baseBelow: 420,      // the hand sits this far below the board
  };
  const STICK = { len: 1500, tipW: 7, baseW: 24 };

  // rx is the long half-axis; every grain is drawn with its long axis along its rotation.
  const TYPES = {
    lentil: { label: 'Lentils', one: 'lentil', rx: 13, ry: 11.5, pitch: 25, gap: 34, size: 12 },
    rice: { label: 'Rice', one: 'rice grain', rx: 17, ry: 6.5, pitch: 34, gap: 22, size: 10.5 },
    mung: { label: 'Mung beans', one: 'mung bean', rx: 11.5, ry: 8.5, pitch: 23, gap: 26, size: 9.5 },
    // Each later bean moves its own way. slide scales how fast a sliding grain stops (below 1 it rolls on), bounce is
    // how much speed it keeps off a wall or another grain, flickK how easily a sweep sends it off, creepK how fast it
    // creeps in as a wrong grain, tiltK how fast it slides down a tilted tray; callK and trailK let a long row of a
    // small seed fill as quickly as a short one; scatterK spreads it further when a row breaks.
    chickpea: { label: 'Chickpeas', one: 'chickpea', rx: 15, ry: 13.5, pitch: 30, gap: 38, size: 14, mass: 1.9, slide: 0.32, bounce: 0.75, flickK: 1.5, creepK: 0.8, tiltK: 1.5 },
    sesame: { label: 'Sesame', one: 'sesame seed', rx: 8, ry: 4.8, pitch: 15.5, gap: 19, size: 6.5, mass: 0.35, flickK: 1.8, creepK: 1, tiltK: 0.8, callK: 0.5, trailK: 1.6, scatterK: 1.4 },
    kidney: { label: 'Kidney beans', one: 'kidney bean', rx: 19, ry: 10, pitch: 40, gap: 28, size: 13.5, mass: 2.1, slide: 1.4, creepK: 0.75, tiltK: 0.9 },
    // stones are never sorted: they cannot be picked, have no pile, go for the open tips from almost the whole reach
    // and a little faster than wrong grains do, and they are heavy to shove; they stay on the board all round
    stone: { label: 'Stones', one: 'stone', rx: 12.5, ry: 10.5, pitch: 25, gap: 30, size: 11.5, stone: true, mass: 2.4, creepK: 1.3, reachK: 0.95 },
  };

  // Score. Every row pays (grains × 10, plus 100 for a full row or 50 for clearing a kind) times the multiplier.
  // The multiplier starts at ×1 and only grows with full rows: each one adds more the longer the combo of full rows
  // in a row and the faster it was pulled. A short row keeps the multiplier but shrinks it and ends the combo.
  // A wrong grain getting in drops the multiplier to ×1, ends the combo and costs points.
  const SCORE = {
    grain: 10, full: 100, clear: 50, breakPenalty: 50, noBreaks: 0.2, perSecond: 25, spillPerGrain: 5,
    growth: 0.3, comboStep: 0.2, comboCap: 10, shortDecay: 0.85, maxMult: 10,
    stars: [0.15, 0.3, 0.45, 0.62, 0.8],     // share of the perfect run each star needs
  };
  const MILESTONES = { 5: { name: 'Steady hands', bonus: 500 }, 10: { name: 'Grain master', bonus: 1500 }, 15: { name: 'Zen hands', bonus: 3000 } };
  // how long a quick row of n grains takes, and how fast this one was against it
  function paceFor(n, cfg) { return (cfg.paceBase + cfg.pacePerGrain * n) * cfg.paceK; }
  function speedFactor(ratio) { return Math.max(0.2, Math.min(1.6, 1.8 - 0.75 * ratio)); }
  function speedLabel(ratio) { return ratio < 0.75 ? 'Lightning' : ratio < 1.25 ? 'Quick' : ratio < 2 ? 'Steady' : 'Slow'; }
  // how much a full (or clearing) row adds to the multiplier: combo is the count of full rows in a row, this one included
  function multGain(combo, ratio, kind) {
    return SCORE.growth * (1 + SCORE.comboStep * Math.min(combo - 1, SCORE.comboCap)) * speedFactor(ratio) * (kind === 'clear' ? 0.5 : 1);
  }
  // kind: 'full' | 'clear' | 'short'
  function rowPoints(n, kind, mult) {
    return Math.round((n * SCORE.grain + (kind === 'full' ? SCORE.full : kind === 'clear' ? SCORE.clear : 0)) * mult);
  }

  // Pile coordinates are fractions of the playable board; depth and r are fractions of its width.
  // The bottom corners are kept free: that is where the sorted piles grow.
  // tune overrides feel numbers for one level. After these, levels are generated without end.
  const AUTHORED = [
    {
      id: 'first-row', name: 'First row', seed: 11, types: ['lentil'],
      hint: ['Touch and hold. The lentils walk into the sticks.', 'Fill the row to grow your multiplier.'],
      tune: { paceK: 2 },
      piles: [{ type: 'lentil', kind: 'blob', cx: 0.5, cy: 0.4, r: 0.11, count: 18 }],
    },
    {
      id: 'two-heaps', name: 'Two heaps', seed: 23, types: ['lentil', 'rice'],
      hint: ['After every row the sticks switch to the other kind.'],
      tune: { paceK: 1.6 },
      piles: [
        { type: 'lentil', kind: 'blob', cx: 0.3, cy: 0.3, r: 0.12, count: 22 },
        { type: 'rice', kind: 'blob', cx: 0.7, cy: 0.52, r: 0.12, count: 18 },
      ],
    },
    {
      id: 'touching', name: 'Touching', seed: 37, types: ['lentil', 'rice'], hintRows: 2,
      hint: ['Rice next to the tips creeps in. Push it aside with the side of the sticks.'],
      tune: { paceK: 1.3 },
      piles: [
        { type: 'lentil', kind: 'blob', cx: 0.42, cy: 0.36, r: 0.14, count: 24 },
        { type: 'rice', kind: 'blob', cx: 0.6, cy: 0.48, r: 0.13, count: 20 },
      ],
    },
    {
      id: 'strays', name: 'Strays', seed: 41, types: ['lentil', 'rice'], hintRows: 2,
      hint: ['The line under the multiplier wears away. Fill the row before it is gone.', 'A short row keeps the multiplier but shrinks it.'],
      tune: { zoneR: 150, paceK: 1.15 },
      piles: [
        { type: 'lentil', kind: 'blob', cx: 0.32, cy: 0.3, r: 0.14, count: 20 },
        { type: 'rice', kind: 'blob', cx: 0.66, cy: 0.42, r: 0.14, count: 18 },
        { type: 'lentil', kind: 'scatter', x0: 0.06, x1: 0.94, y0: 0.06, y1: 0.8, count: 8 },
        { type: 'rice', kind: 'scatter', x0: 0.06, x1: 0.94, y0: 0.06, y1: 0.8, count: 8 },
      ],
    },
    {
      id: 'the-slate', name: 'The slate', seed: 53, types: ['lentil', 'rice'],
      tune: { zoneR: 145 },
      piles: [
        { type: 'lentil', kind: 'edge', side: 'top', from: 0, to: 0.66, depth: 0.12, count: 26 },
        { type: 'rice', kind: 'edge', side: 'top', from: 0.54, to: 1, depth: 0.1, count: 14 },
        { type: 'lentil', kind: 'edge', side: 'left', from: 0.1, to: 0.6, depth: 0.1, count: 12 },
        { type: 'rice', kind: 'scatter', x0: 0.25, x1: 0.95, y0: 0.08, y1: 0.7, count: 10 },
        { type: 'lentil', kind: 'scatter', x0: 0.1, x1: 0.75, y0: 0.15, y1: 0.65, count: 6 },
      ],
    },
    {
      id: 'short-reach', name: 'Short reach', seed: 59, types: ['lentil', 'rice'], rule: 'Short reach',
      ruleText: 'The sticks pull from close by. Drive the tips through the grains.',
      tune: { zoneR: 105, creepR: 70 },
      piles: [
        { type: 'lentil', kind: 'scatter', x0: 0.05, x1: 0.95, y0: 0.05, y1: 0.8, count: 22 },
        { type: 'rice', kind: 'scatter', x0: 0.05, x1: 0.95, y0: 0.05, y1: 0.8, count: 18 },
        { type: 'lentil', kind: 'blob', cx: 0.25, cy: 0.25, r: 0.08, count: 6 },
        { type: 'rice', kind: 'blob', cx: 0.75, cy: 0.55, r: 0.08, count: 6 },
      ],
    },
    {
      id: 'mixed-heap', name: 'Mixed heap', seed: 67, types: ['lentil', 'rice'], rule: 'Pushy rice',
      ruleText: 'Rice creeps in from further away. Sweep the heap apart, then gather.',
      tune: { zoneR: 135, creepR: 115, creepSpeed: 80 },
      piles: [
        { type: 'lentil', kind: 'blob', cx: 0.46, cy: 0.42, r: 0.21, count: 26 },
        { type: 'rice', kind: 'blob', cx: 0.55, cy: 0.47, r: 0.21, count: 22 },
      ],
    },
    {
      id: 'mung-beans', name: 'Mung beans', seed: 71, types: ['lentil', 'rice', 'mung'],
      hint: ['A third kind, with its own pile in the middle.'],
      tune: { zoneR: 140 },
      piles: [

      S.phase = 'close'; S.pt = 0; dropTrail(); sim.waitLift = !sim.manual; S.lifted = !!lifted;

    // which pile the row hangs over, carrying it yourself: the nearest within reach of the middle of the row
    function dropAt() {
      const n = S.row.length;

      const x = G.Tx - G.ux * depth, y = G.Ty - G.uy * depth;
      let best = null, bd = Infinity;
      for (const t in sim.stores) {

    function startCarry(dest) {
      const type = S.rowType, st = dest || sim.stores[type], n = S.row.length;
      S.dest = st.type;

      const G = sim.geom();
      const depth = sim.slot0(type) + ((n - 1) * TYPES[type].pitch) / 2;
      const rcx = G.Tx - G.ux * depth, rcy = G.Ty - G.uy * depth;

      S.row = [];
      ids.forEach((id, i) => {

      const rowTime = sim.clock - sim.lastPull, ratio = rowTime / paceFor(n, cfg), speed = speedLabel(ratio);
      sim.lastPull = sim.clock;

      sim.stats.rowPts += points - bonus; sim.stats.comboPts += bonus;

    }

    function breakRow(bad, G) {
      const lost = S.row.concat(S.trail);
      lost.push(bad.id);
      const base = Math.atan2(G.uy, G.ux);
      for (const id of lost) {
        const g = sim.grains[id];
        const ang = base + (rng() - 0.5) * 2.6;
        const T = TYPES[g.type], v = cfg.breakScatter * cfg.friction * (T.slide || 1) * (T.scatterK || 1) * (0.45 + rng() * 0.8);
        g.st = ST.SLIDE; g.vx = Math.cos(ang) * v; g.vy = Math.sin(ang) * v; g.w = (rng() - 0.5) * 18; g.warn = 0;
      }
      const inRow = S.row.length, comboLost = sim.combo, multLost = sim.mult;
      const penalty = Math.min(sim.score, Math.round(SCORE.breakPenalty * sim.mult));
      S.row = []; S.trail = [];
      sim.combo = 0; sim.mult = 1; sim.score -= penalty; sim.lastPull = sim.clock;

    }

    // the sticks are solid on the board: their sides shove loose grains out of the way
    function pushGrains(G) {
      const L = STICK.len, tw = STICK.tipW, bw = STICK.baseW;
      let n = 0;

    // Loose grains are solid against each other. A grain the sticks are shoving, one walking into them, or a wrong

    // the mouth. A sliding grain hands its speed on like a pool ball and can set a resting one sliding.
    const CELL = 40, nrm = { nx: 0, ny: 0 };

      const o = overlap(a, b, nrm);

      } else {

        const side = Math.atan2(ny, nx) + Math.PI / 2;            // a long grain pushed on turns side-on to the push
        if (ELONG[a.type] > 0.05) a.rot = turn(a.rot, side, ELONG[a.type] * Math.min(0.3, (k * ia) / 8));

      }

    }
    function collide() {
      if (!cfg.solid) return;
      const gs = sim.grains, cols = Math.ceil(W / CELL) + 1, rows = Math.ceil((sim.H + 200) / CELL) + 1;
      if (cHead.length < cols * rows) cHead = new Int32Array(cols * rows);
      if (cNext.length < gs.length) cNext = new Int32Array(gs.length + 64);
      for (const g of gs) {
        if (!solid(g)) continue;

    function tickClocks(dt) {

    // The next kind: in turn, or by chance in a level where the sticks ask for any kind. A kind on the board comes
    // before one still in the jar.
    function switchTarget() {

      if (sim.order === 'any') {

        if (!c.length) c = order.filter(left);
        if (!c.length) return;
        const t = c[Math.floor(orderRng() * c.length)];
        const again = t === sim.target; sim.target = t;
        emit('target', { grain: t, again });
        return;
      }
      for (const ok of [onBoard, left]) {
        for (let k = 1; k <= order.length; k++) {
          const t = order[(i + k) % order.length];
          if (ok(t)) {
            if (t !== sim.target) { sim.target = t; emit('target', { grain: t }); }
            return;
          }
        }
      }
    }

    // the jar: from the first touch, a scoop at a time, one grain after another, landing as one heap
    function pourJar(dt) {
      const J = sim.jar;
      if (!J) return;
      J.tip = Math.max(0, J.tip - dt * 1.6);
      if (!sim.started || sim.done) return;
      if (!J.pour.length && J.scoops.length) {

        let clear = !S.row.length && !S.trail.length;

        J.idle = clear ? J.idle + dt : 0;
        if (sim.clock >= J.next || J.idle >= 0.5) {
          J.pour = J.scoops.shift(); J.next = sim.clock + J.every; J.idle = 0; J.aim = (rng() - 0.5) * 0.5; J.early = clear;

        }
      }
      if (!J.pour.length) return;
      J.tip = 1; J.gap -= dt;
      if (J.gap > 0) return;
      J.gap = 0.06;
      const g = sim.grains[J.pour.shift()], T = TYPES[g.type], B = bounds(), dir = J.left ? 1 : -1;
      const a = 0.6 + J.aim + (rng() - 0.5) * 0.45, dist = (150 + rng() * 130) * J.reach, v = dist * cfg.friction * (T.slide || 1);
      g.x = clamp(J.x + dir * 40, B.x0, B.x1); g.y = clamp(J.y + 14 + rng() * 10, B.y0, B.y1);
      g.vx = Math.cos(a) * v * dir; g.vy = Math.sin(a) * v; g.w = (rng() - 0.5) * 20;
      g.st = ST.SLIDE; g.px = NaN;
      emit('jar_grain', { id: g.id, grain: g.type });
      // waiting on a scoop with the board cleared is the jar's time, not yours: the next row's pace starts now
      if (!J.pour.length && J.early && !S.row.length) sim.lastPull = sim.clock;
    }

    // input: { down, x, y } with x, y the finger in board units
    sim.step = function (input) {
      const dt = 1 / cfg.stepHz;
      sim.t += dt; sim.steps++;
      const down = !!(input && input.down) && !sim.done;
      if (!down) sim.waitLift = false;
      const ix = input && Number.isFinite(input.x) ? input.x : W / 2;
      const iy = input && Number.isFinite(input.y) ? input.y : sim.H * 0.7;
      const ax = clamp(ix, 24, W - 24), ay = clamp(iy - cfg.fingerOffset, sim.top - 40, sim.H - 90);
      switch (S.phase) {
        case 'away':
          if (down && !sim.waitLift) beginEnter(ax, ay);
          break;
        case 'enter': {
          follow(ax, ay, dt); S.pt += dt;
          const k = Math.min(1, S.pt / cfg.enterTime);
          S.carry = cfg.enterDist * Math.pow(1 - k, 3);
          approachGap(openGap(), 18, dt);
          if (!down) startRetract();
          else if (k >= 1) { S.phase = 'open'; S.pt = 0; }
          break;
        }
        case 'open': {
          follow(ax, ay, dt); approachGap(openGap(), 20, dt); S.pt += dt;
          S.pushN += pushGrains(sim.geom());
          if (S.pushN && sim.t - S.pushT > 0.06) { emit('push', { n: S.pushN, speed: Math.hypot(S.vx, S.vy) }); S.pushN = 0; S.pushT = sim.t; }
          gather(dt);

          if (S.need > 0 && S.row.length >= S.need) startClose(!down);
          else if (!down) { if (S.row.length) startClose(true); else startRetract(); }
          break;
        }
        case 'close':
          S.pt += dt; approachGap(3, 40, dt);
          if (down && sim.manual) follow(ax, ay, dt);
          if (S.pt >= cfg.closeTime) {
            if (!sim.manual) startCarry();
            else { S.phase = S.lifted || !down ? 'parked' : 'hold'; S.pt = 0; emit(S.phase === 'hold' ? 'lift_row' : 'parked', { grain: S.rowType }); }
          }
          break;
        case 'hold':          // carrying the closed row yourself: let go over a pile to pour it there
          S.pt += dt; approachGap(3, 40, dt);
          if (down) {
            follow(ax, ay, dt);
            S.pushN += pushGrains(sim.geom());
            if (S.pushN && sim.t - S.pushT > 0.06) { emit('push', { n: S.pushN, speed: Math.hypot(S.vx, S.vy) }); S.pushN = 0; S.pushT = sim.t; }
          }
          { const d = dropAt(); if (d !== S.drop) { S.drop = d; emit('over_pile', { pile: d ? d.type : null }); } }
          if (!down) {
            if (S.drop) startCarry(S.drop);
            else { S.phase = 'parked'; S.pt = 0; emit('parked', { grain: S.rowType }); }

  // A simple player: aims just below the densest clean patch of the row's kind, coming at it from the side away
  // from wrong grains, and lets go when a wrong grain gets close. Used by the tests and by the title screen.
  function makeBot(sim, seed, opts) {
    const rng = mulberry32((seed >>> 0) || 7);
    opts = opts || {};
    const maxMoves = opts.moves == null ? 3 : opts.moves;
    let aim = null, cool = 0, hold = 0, moves = 0;
    const tabu = [], nudged = new Map();
    const finger = (a) => ({ down: true, x: a.x, y: Math.min(sim.H, a.y + sim.cfg.fingerOffset) });
    const up = () => ({ down: false, x: aim ? aim.x : W / 2, y: aim ? aim.y + sim.cfg.fingerOffset : sim.H * 0.7 });
    // An aim is safe when the grain it is after sits in the reach and no wrong grain sits in the creep field.
    // Touching pairs have no safe aim: then the bot slides a stick in between them first, as a player would.
    function pick() {
      const type = sim.target, R = sim.cfg.zoneR, CR = sim.cfg.creepR, cands = [];
      for (const g of sim.grains) if (g.st === ST.REST && g.type === type && (!opts.maxY || g.y < opts.maxY)) cands.push(g);
      if (!cands.length) return null;
      const near = [];
      let best = null, bs = -Infinity, stuck = null, ss = Infinity;
      const n = Math.min(24, cands.length);
      for (let i = 0; i < n; i++) {
        const c = cands[Math.floor(rng() * cands.length)];
        near.length = 0;
        let wd = Infinity, w = null;
        for (const g of sim.grains) {
          if (g.st !== ST.REST) continue;
          const d = Math.hypot(g.x - c.x, g.y - c.y);
          if (d < R * 2.2) near.push(g);
          if (g.type !== type && d < wd) { wd = d; w = g; }
        }
        let safeHere = false;
        for (const df of [0.35, 0.6, 0.85]) {
          for (const deg of [0, -25, 25, -50, 50]) {
            const a = (deg * Math.PI) / 180;
            const ax = Math.max(24, Math.min(W - 24, c.x + Math.sin(a) * R * df));
            const ay = Math.max(sim.top - 40, Math.min(opts.maxY || sim.H - sim.cfg.fingerOffset, c.y + Math.cos(a) * R * df));
            const G = sim.geomAt(ax, ay);
            if (!sim.inFieldAt(c.x, c.y, G, R * 0.92)) continue;
            let sc = rng() * 0.5;
            for (const g of near) {
              if (g.type === type) { if (sim.inFieldAt(g.x, g.y, G, R)) sc += 1; }
              else if (sim.inFieldAt(g.x, g.y, G, CR + 14)) sc -= 40;
            }
            if (sc > -1) safeHere = true;
            for (const t of tabu) if (Math.hypot(t.x - ax, t.y - ay) < 90) sc -= 30;
            if (sc > bs) { bs = sc; best = { x: ax, y: ay }; }
          }
        }
        if (!safeHere && w && wd < ss) { ss = wd; stuck = { c, w }; }
      }
      if (best && bs > -1) return best;
      if (stuck && opts.nudge !== false && (nudged.get(stuck.c.id) || 0) < 3) {
        // slide the sticks in between the pair, tips well past them so neither is pulled, then sweep one of them
        // away: whichever has more open board on its side, so nothing gets shoved into a wall or a pile
        const { c, w } = stuck, mx = (c.x + w.x) / 2, my = (c.y + w.y) / 2;
        const u = sim.geomAt(mx, my - 100), D = 110;
        const tx = Math.max(24, Math.min(W - 24, mx + u.ux * D)), ty = my + u.uy * D;
        if (ty > sim.top - 40) {
          let sx = -u.uy, sy = u.ux;                                       // across the sticks, from c toward w
          if ((w.x - c.x) * sx + (w.y - c.y) * sy < 0) { sx = -sx; sy = -sy; }
          const B = sim.bounds();
          const room = (x, y) => {
            let r = Math.min(x - B.x0, B.x1 - x, y - B.y0, B.y1 - y);
            for (const k in sim.stores) { const st = sim.stores[k]; r = Math.min(r, Math.hypot(x - st.x, y - st.y) - st.r - 30); }
            return r;
          };
          if (room(c.x - sx * 45, c.y - sy * 45) > room(w.x + sx * 45, w.y + sy * 45)) { sx = -sx; sy = -sy; }
          nudged.set(c.id, (nudged.get(c.id) || 0) + 1);
          return { x: tx, y: ty, nudge: { dx: sx * 45, dy: sy * 45 } };
        }
      }
      return best;
    }
    return function next() {
      const S = sim.sticks;
      if (sim.done) return { down: false, x: W / 2, y: sim.H * 0.7 };
      if (sim.manual && (S.phase === 'close' || S.phase === 'hold' || S.phase === 'parked')) {
        // carrying it: the tips as low as a thumb on the screen's edge puts them, beside the row's own pile
        if (S.phase === 'close') return finger(aim || { x: S.tx, y: S.ty });
        const st = sim.stores[S.rowType], to = { x: st.x + (W / 2 - st.x) * 0.3, y: sim.H - sim.cfg.fingerOffset - 4 };
        if (S.phase === 'hold' && S.drop === st && Math.hypot(S.tx - to.x, S.ty - Math.min(to.y, sim.H - 90)) < 70) return up();
        return finger(to);
      }
      if (S.phase === 'close' || S.phase === 'carry' || S.phase === 'pour' || S.phase === 'snap') return up();
      if (S.phase === 'away' || S.phase === 'retract') {
        if (cool > 0) { cool--; return up(); }
        if (sim.waitLift) return up();
        aim = pick(); hold = 0; moves = 0;
        if (!aim) { cool = 20; return up(); }
        return finger(aim);
      }
      hold += 1 / sim.cfg.stepHz;
      const G = sim.geom();
      if (aim.nudge) {                                                   // the separating sweep
        if (S.phase === 'open' && hold > 0.42) { cool = 6; aim = { x: aim.x + aim.nudge.dx, y: aim.y + aim.nudge.dy }; return up(); }
        const k = Math.max(0, Math.min(1, (hold - 0.18) / 0.22));
        return finger({ x: aim.x + aim.nudge.dx * k, y: aim.y + aim.nudge.dy * k });
      }
      if (S.phase === 'open') {
        for (const g of sim.grains) {
          if (g.st !== ST.REST || g.type === S.rowType) continue;
          if (Math.hypot(g.x - G.mx, g.y - G.my) < 48) {
            tabu.push({ x: aim.x, y: aim.y }); if (tabu.length > 4) tabu.shift();
            cool = 4 + Math.floor(rng() * 8);
            return up();
          }
        }
      }
      if (S.phase === 'open' && S.trail.length === 0 && hold > 0.3) {
        let any = false;
        for (const g of sim.grains) if (g.st === ST.REST && g.type === S.rowType && sim.inReach(g)) { any = true; break; }
        if (!any) {

          if (!next) { cool = 6; return up(); }
          aim = next; moves++; hold = 0;
        }
      }

    };
  }

  return {
    W, ST, DEFAULTS, STICK, TYPES, AUTHORED, DEMO, SCORE, MILESTONES, TWIST, NEWS, KIND_FROM,
    BOARDS, boardOf, newsAt, mulberry32, mixOf, mixTarget, capacity, totalsFor, paceFor, speedFactor, speedLabel, multGain, rowPoints, idealScore, starsFor, parTime, difficulty,
    validateLevel, levelFor, create, makeBot,
    overlapOf(a, b) { orient(a); orient(b); return overlap(a, b, { nx: 0, ny: 0 }); },
  };
})();
// ===== GRAIN-SIM END =====
</script>

    get sim() { return sim; }, get screen() { return screen; }, cfg, save, Analytics, Sound, Room, Night, cam, get film() { return film; },
    startLevel, levelId: idAt, autoplay(on) { autoBot = on && sim ? GS.makeBot(sim, 99) : null; releaseInput(); },
  };
})();
